<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 594" width="360" height="594" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs>
<rect x="0.5" y="0.5" width="359" height="593" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">防线全景：七片奶酪叠在一起</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">每层都有漏洞，攻击要穿过所有对齐的孔</text>
<text x="32" y="76" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">不可信内容进入</text>
<rect x="20" y="92" width="320" height="40" rx="8" fill="#dbe7fb" stroke="#2f6fdf"/>
<circle cx="240" cy="112.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<circle cx="300" cy="112.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="32" y="110" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">① 输入侧：包裹、截断、检测</text>
<text x="32" y="125" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">第 2 章</text>
<text x="32" y="154" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">模型决定动作</text>
<rect x="20" y="164" width="320" height="40" rx="8" fill="#dbe7fb" stroke="#2f6fdf"/>
<circle cx="266" cy="184.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<circle cx="300" cy="184.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="32" y="182" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">② 污染感知的权限决策</text>
<text x="32" y="197" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">第 2 章</text>
<rect x="20" y="214" width="320" height="40" rx="8" fill="#dbe7fb" stroke="#2f6fdf"/>
<circle cx="236" cy="234.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<circle cx="300" cy="234.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="32" y="232" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">③ 参数级策略</text>
<text x="32" y="247" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">第 4 章</text>
<rect x="20" y="264" width="320" height="40" rx="8" fill="#dbe7fb" stroke="#2f6fdf"/>
<circle cx="252" cy="284.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<circle cx="300" cy="284.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="32" y="282" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">④ 人工确认</text>
<text x="32" y="297" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">第 5 章</text>
<rect x="20" y="314" width="320" height="40" rx="8" fill="#dbe7fb" stroke="#2f6fdf"/>
<circle cx="240" cy="334.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<circle cx="300" cy="334.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="32" y="332" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">⑤ 专用凭证的权限范围</text>
<text x="32" y="347" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">第 4 章</text>
<rect x="20" y="364" width="320" height="40" rx="8" fill="#2f6fdf" stroke="#2f6fdf"/>
<circle cx="226" cy="384.0" r="12" fill="#ffffff" stroke="#d8dee4" stroke-opacity="0.6"/>
<circle cx="266" cy="384.0" r="12" fill="#ffffff" stroke="#d8dee4" stroke-opacity="0.6"/>
<text x="32" y="382" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600">⑥ 沙箱：文件、网络、资源</text>
<text x="32" y="397" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">第 3 章</text>
<rect x="20" y="414" width="320" height="40" rx="8" fill="#dbe7fb" stroke="#2f6fdf"/>
<circle cx="256" cy="434.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<circle cx="310" cy="434.0" r="12" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="32" y="432" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">⑦ 资源自身的访问控制</text>
<text x="32" y="447" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">第 4 章</text>
<line x1="300" y1="66" x2="300" y2="361" stroke="#1f2328" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="286" y1="364" x2="314" y2="364" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
<text x="308" y="76" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">攻击</text>
<text x="32" y="476" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">对外产生影响（没有到达）</text>
<rect x="20" y="492" width="320" height="58" rx="8" fill="#e6e9ed" stroke="#d8dee4" stroke-dasharray="4 3"/>
<text x="32" y="514" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">审计与回放（第 6 章）不是一片奶酪</text>
<text x="32" y="534" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">记录 ②④⑥ 的决策，不拦攻击，用于事后追溯</text>
<line x1="24" y1="572" x2="46" y2="572" stroke="#1f2328" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="52" y="576" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">攻击路径</text>
<circle cx="128" cy="572" r="8" fill="#ffffff" stroke="#2f6fdf" stroke-opacity="0.6"/>
<text x="140" y="576" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">漏洞</text>
<rect x="186" y="564" width="18" height="16" rx="3" fill="#2f6fdf"/>
<text x="210" y="576" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">挡住攻击的一层</text>
</svg>

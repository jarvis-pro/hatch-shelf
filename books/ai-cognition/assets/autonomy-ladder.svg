<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">人机协作的自主程度</text>
<rect x="24" y="234.0" width="60" height="36.0" rx="4" fill="#e6e9ed"/>
<text x="54.0" y="256.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">L0</text>
<rect x="88" y="194.4" width="60" height="75.6" rx="4" fill="#dbe7fb"/>
<text x="118.0" y="216.4" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">L1</text>
<rect x="152" y="154.8" width="60" height="115.2" rx="4" fill="#dbe7fb"/>
<text x="182.0" y="176.8" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">L2</text>
<rect x="216" y="115.2" width="60" height="154.8" rx="4" fill="#2f6fdf"/>
<text x="246.0" y="137.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">L3</text>
<rect x="280" y="75.6" width="60" height="194.4" rx="4" fill="#2f6fdf"/>
<text x="310.0" y="97.6" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">L4</text>
<line x1="20" y1="270" x2="340" y2="270" stroke="#d8dee4"/>
<text x="24" y="292" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">左：人的参与多</text>
<text x="336" y="292" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">右：AI 的自主多</text>
<text x="180" y="314" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600">不可逆操作停在 L2 及以下</text>
<text x="118.0" y="236.4" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">人做</text>
<text x="118.0" y="252.4" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">AI 建议</text>
<text x="182.0" y="196.8" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">AI 做</text>
<text x="182.0" y="212.8" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">人逐项审</text>
<text x="246.0" y="157.2" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">AI 做</text>
<text x="246.0" y="173.2" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">人抽查</text>
<text x="310.0" y="117.6" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">AI 做</text>
<text x="310.0" y="133.6" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">人管异常</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
  <rect x="0.5" y="0.5" width="359" height="339" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="180" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">180 度轴线规则（俯视图）</text>
  <rect x="16" y="140" width="328" height="150" fill="#dbe7fb" fill-opacity="0.6"/>
  <text x="330" y="282" text-anchor="end" font-size="12" fill="#2f6fdf">机位可用的一侧</text>
  <line x1="16" y1="140" x2="344" y2="140" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="24" y="132" font-size="12" fill="#1f2328">轴线</text>
  <circle cx="110" cy="140" r="16" fill="#656d76"/>
  <text x="110" y="145" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">A</text>
  <circle cx="250" cy="140" r="16" fill="#656d76"/>
  <text x="250" y="145" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">B</text>
  <g fill="#2f6fdf">
    <rect x="58" y="214" width="26" height="18" rx="3"/>
    <rect x="276" y="214" width="26" height="18" rx="3"/>
    <rect x="167" y="238" width="26" height="18" rx="3"/>
  </g>
  <g stroke="#2f6fdf" stroke-width="1.2" fill="none">
    <line x1="80" y1="214" x2="238" y2="152"/>
    <line x1="280" y1="214" x2="122" y2="152"/>
    <line x1="180" y1="238" x2="180" y2="160"/>
  </g>
  <g font-size="12" fill="#1f2328">
    <text x="40" y="250">机位 1：拍 B</text>
    <text x="40" y="265" fill="#656d76">A 在左、B 在右</text>
    <text x="250" y="250">机位 2：拍 A</text>
    <text x="250" y="265" fill="#656d76">仍是 A 左 B 右</text>
    <text x="180" y="272" text-anchor="middle">机位 3：双人</text>
  </g>
  <rect x="167" y="52" width="26" height="18" rx="3" fill="none" stroke="#656d76" stroke-dasharray="3 2"/>
  <line x1="160" y1="46" x2="200" y2="76" stroke="#656d76" stroke-width="1.5"/>
  <line x1="200" y1="46" x2="160" y2="76" stroke="#656d76" stroke-width="1.5"/>
  <text x="208" y="62" font-size="12" fill="#656d76">机位 4：越轴</text>
  <text x="208" y="78" font-size="12" fill="#656d76">画面中 A、B 左右互换</text>
  <text x="180" y="314" text-anchor="middle" font-size="12" fill="#1f2328">同一场戏的机位都放在轴线同一侧</text>
  <text x="180" y="330" text-anchor="middle" font-size="11" fill="#656d76">A、B 为两个对话角色；蓝色方块为摄影机</text>
</svg>

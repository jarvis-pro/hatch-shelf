<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
  <rect x="0.5" y="0.5" width="359" height="399" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">当铺场景俯视图：机位与轴线</text>
  <rect x="20" y="44" width="160" height="286" fill="#dbe7fb" fill-opacity="0.6"/>
  <path d="M140 330 H20 V44 H340 V330 H220" fill="none" stroke="#656d76" stroke-width="2"/>
  <rect x="40" y="50" width="280" height="16" fill="#e6e9ed" stroke="#d8dee4"/>
  <text x="250" y="62" text-anchor="middle" font-size="11" fill="#656d76">小抽屉墙 · 「当」字木牌</text>
  <rect x="60" y="161" width="240" height="18" fill="#e6e9ed" stroke="#656d76"/>
  <text x="246" y="174" text-anchor="middle" font-size="12" fill="#1f2328">柜台</text>
  <circle cx="74" cy="170" r="6" fill="#2f6fdf"/>
  <text x="74" y="153" text-anchor="middle" font-size="12" fill="#1f2328">油灯</text>
  <rect x="280" y="164" width="14" height="12" fill="#656d76"/>
  <text x="300" y="197" text-anchor="end" font-size="12" fill="#1f2328">算盘账本</text>
  <line x1="180" y1="74" x2="180" y2="304" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="186" y="318" font-size="12" fill="#1f2328">轴线</text>
  <g stroke="#2f6fdf" stroke-width="1.2" fill="none">
    <line x1="88" y1="273" x2="170" y2="132"/>
    <line x1="120" y1="111" x2="170" y2="208"/>
    <line x1="45" y1="140" x2="164" y2="122"/>
    <line x1="45" y1="140" x2="164" y2="216"/>
  </g>
  <g fill="#2f6fdf">
    <rect x="69" y="273" width="22" height="14" rx="3"/>
    <rect x="102" y="97" width="22" height="14" rx="3"/>
    <rect x="23" y="133" width="22" height="14" rx="3"/>
  </g>
  <circle cx="180" cy="120" r="14" fill="#656d76"/>
  <text x="180" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">沈</text>
  <circle cx="180" cy="222" r="14" fill="#656d76"/>
  <text x="180" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">陆</text>
  <text x="200" y="124" font-size="12" fill="#1f2328">沈青禾（柜台内）</text>
  <text x="200" y="226" font-size="12" fill="#1f2328">陆归（柜台外）</text>
  <g font-size="12" fill="#1f2328">
    <text x="28" y="306">1 正打：拍沈</text>
    <text x="28" y="88">2 反打：拍陆</text>
    <text x="26" y="125">3 双人</text>
  </g>
  <rect x="279" y="244" width="22" height="14" rx="3" fill="none" stroke="#656d76" stroke-dasharray="3 2"/>
  <line x1="276" y1="240" x2="304" y2="262" stroke="#656d76" stroke-width="1.5"/>
  <line x1="304" y1="240" x2="276" y2="262" stroke="#656d76" stroke-width="1.5"/>
  <text x="334" y="282" text-anchor="end" font-size="12" fill="#656d76">4 越轴：沈陆左右互换</text>
  <text x="180" y="348" text-anchor="middle" font-size="12" fill="#656d76">大门 · 门外雨夜街道</text>
  <text x="180" y="370" text-anchor="middle" font-size="12" fill="#1f2328">1、2、3 号机位都在轴线同一侧：画面里沈左陆右</text>
  <text x="180" y="388" text-anchor="middle" font-size="11" fill="#656d76">轴线是两人的连线；蓝色方块为摄影机，蓝线为拍摄方向</text>
</svg>

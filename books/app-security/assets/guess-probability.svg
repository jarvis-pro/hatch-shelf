<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" width="360" height="352" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="351" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">短码被猜中的概率（对数刻度）</text>
<text x="20" y="58" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">6 位验证码，单条码最多试 5 次</text>
<rect x="20" y="66" width="37.3" height="16" rx="3" fill="#2f6fdf"/>
<text x="63.27840023125433" y="78" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">0.0005%</text>
<text x="20" y="108" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">6 位验证码，按号每天最多 10 条</text>
<rect x="20" y="116" width="90.6" height="16" rx="3" fill="#2f6fdf"/>
<text x="116.61173356458767" y="128" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">0.005%</text>
<text x="20" y="158" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">4 位 PIN，每次服务最多错 5 次</text>
<rect x="20" y="166" width="143.9" height="16" rx="3" fill="#2f6fdf"/>
<text x="169.945066897921" y="178" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">0.05%</text>
<text x="20" y="208" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">6 位验证码，按号限额持续一整年</text>
<rect x="20" y="216" width="227.1" height="16" rx="3" fill="#2f6fdf"/>
<text x="241.05637517116557" y="228" font-size="11" fill="#ffffff" text-anchor="end" font-weight="600">1.8%</text>
<text x="20" y="258" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">6 位验证码，不限流（每秒 100 次）</text>
<rect x="20" y="266" width="320.0" height="16" rx="3" fill="#2f6fdf"/>
<text x="334.0" y="278" font-size="11" fill="#ffffff" text-anchor="end" font-weight="600">100%，约 2.8 小时穷举完</text>
<line x1="20.0" y1="294" x2="20.0" y2="299" stroke="#656d76"/>
<text x="20.0" y="313" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">0.0001%</text>
<line x1="126.7" y1="294" x2="126.7" y2="299" stroke="#656d76"/>
<text x="126.66666666666666" y="313" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.01%</text>
<line x1="233.3" y1="294" x2="233.3" y2="299" stroke="#656d76"/>
<text x="233.33333333333331" y="313" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">1%</text>
<line x1="340.0" y1="294" x2="340.0" y2="299" stroke="#656d76"/>
<text x="340.0" y="313" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">100%</text>
<line x1="20" y1="294" x2="340" y2="294" stroke="#d8dee4"/>
<text x="20" y="336" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">每次猜中概率按 1/10⁶（6 位）或 1/10⁴（4 位）计算</text>
</svg>

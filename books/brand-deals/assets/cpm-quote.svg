<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
  <rect x="0.5" y="0.5" width="359" height="289" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">按目标 CPM 倒推报价</text>
  <text x="180" y="48" text-anchor="middle" font-size="12" fill="#656d76">预期播放 6,966；报价 = 6,966 ÷ 1000 × CPM</text>
  <!-- axis: y from 230 (0) to 80 (1500) ; scale 0.1 px per yuan -->
  <line x1="50" y1="230" x2="335" y2="230" stroke="#656d76"/>
  <line x1="50" y1="80" x2="335" y2="80" stroke="#d8dee4"/>
  <line x1="50" y1="130" x2="335" y2="130" stroke="#d8dee4"/>
  <line x1="50" y1="180" x2="335" y2="180" stroke="#d8dee4"/>
  <text x="44" y="234" text-anchor="end" font-size="11" fill="#656d76">0</text>
  <text x="44" y="184" text-anchor="end" font-size="11" fill="#656d76">500</text>
  <text x="44" y="134" text-anchor="end" font-size="11" fill="#656d76">1000</text>
  <text x="44" y="84" text-anchor="end" font-size="11" fill="#656d76">1500</text>
  <!-- bars: 348, 697, 1045, 1393 -> heights 34.8, 69.7, 104.5, 139.3 -->
  <rect x="70" y="195.2" width="44" height="34.8" fill="#dbe7fb"/>
  <rect x="136" y="160.3" width="44" height="69.7" fill="#2f6fdf" opacity="0.6"/>
  <rect x="202" y="125.5" width="44" height="104.5" fill="#2f6fdf" opacity="0.8"/>
  <rect x="268" y="90.7" width="44" height="139.3" fill="#2f6fdf"/>
  <text x="92" y="189" text-anchor="middle" font-size="12" fill="#1f2328">348</text>
  <text x="158" y="154" text-anchor="middle" font-size="12" fill="#1f2328">697</text>
  <text x="224" y="119" text-anchor="middle" font-size="12" fill="#1f2328">1,045</text>
  <text x="290" y="85" text-anchor="middle" font-size="12" fill="#1f2328">1,393</text>
  <text x="92" y="248" text-anchor="middle" font-size="12" fill="#656d76">50</text>
  <text x="158" y="248" text-anchor="middle" font-size="12" fill="#656d76">100</text>
  <text x="224" y="248" text-anchor="middle" font-size="12" fill="#656d76">150</text>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="#656d76">200</text>
  <text x="192" y="266" text-anchor="middle" font-size="12" fill="#656d76">目标 CPM（元，演示用假设值）</text>
  <text x="192" y="282" text-anchor="middle" font-size="11" fill="#656d76">纵轴：报价（元）</text>

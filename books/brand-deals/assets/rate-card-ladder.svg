<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" width="360" height="366" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="365" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="28.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">刊例价阶梯：按形式和时长分档</text>
<text x="180.0" y="47.0" font-size="12" fill="#656d76" text-anchor="middle">A = 3,000 元，B = 1,200 元（取自本章打包示例）</text>
<text x="20.0" y="78.0" font-size="12" fill="#1f2328" text-anchor="start">小红书图文笔记</text>
<rect x="20.0" y="85.0" width="67.7" height="18.0" fill="#dbe7fb" rx="3"/>
<text x="93.7" y="99.0" font-size="12" fill="#1f2328" text-anchor="start">1,200（B）</text>
<text x="20.0" y="124.0" font-size="12" fill="#1f2328" text-anchor="start">植入（视频内 30 秒以内）</text>
<rect x="20.0" y="131.0" width="84.6" height="18.0" fill="#2f6fdf" rx="3"/>
<text x="110.6" y="145.0" font-size="12" fill="#1f2328" text-anchor="start">1,500（A × 0.5）</text>
<text x="20.0" y="170.0" font-size="12" fill="#1f2328" text-anchor="start">小红书视频笔记</text>
<rect x="20.0" y="177.0" width="101.5" height="18.0" fill="#dbe7fb" rx="3"/>
<text x="127.5" y="191.0" font-size="12" fill="#1f2328" text-anchor="start">1,800（B × 1.5）</text>
<text x="20.0" y="216.0" font-size="12" fill="#1f2328" text-anchor="start">定制视频（60 秒以内）</text>
<rect x="20.0" y="223.0" width="169.2" height="18.0" fill="#2f6fdf" rx="3"/>
<text x="195.2" y="237.0" font-size="12" fill="#1f2328" text-anchor="start">3,000（A）</text>
<text x="20.0" y="262.0" font-size="12" fill="#1f2328" text-anchor="start">定制视频（60 秒以上）</text>
<rect x="20.0" y="269.0" width="220.0" height="18.0" fill="#2f6fdf" rx="3"/>
<text x="246.0" y="283.0" font-size="12" fill="#1f2328" text-anchor="start">3,900（A × 1.3）</text>
<rect x="20.0" y="300.0" width="12.0" height="12.0" fill="#2f6fdf" rx="2"/>
<text x="38.0" y="310.0" font-size="12" fill="#656d76" text-anchor="start">抖音（A 档）</text>
<rect x="140.0" y="300.0" width="12.0" height="12.0" fill="#dbe7fb" rx="2"/>
<text x="158.0" y="310.0" font-size="12" fill="#656d76" text-anchor="start">小红书（B 档）</text>
<text x="20.0" y="334.0" font-size="11" fill="#656d76" text-anchor="start">倍数关系是示例结构，按自己的工时差异调整；</text>
<text x="20.0" y="350.0" font-size="11" fill="#656d76" text-anchor="start">A、B 本身用倒推法算出，不代表行业行情</text>
</svg>

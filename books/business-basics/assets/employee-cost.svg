<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" width="360" height="384" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="383" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">公司为一个人每月花的钱（合计 25,000 元）</text>
<text x="104.0" y="71.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">税前工资</text>
<rect x="112" y="58" width="190.0" height="18" rx="3" fill="#2f6fdf"/>
<text x="308.0" y="71.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">15,000</text>
<text x="104.0" y="101.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">社保单位部分</text>
<rect x="112" y="88" width="49.4" height="18" rx="3" fill="#dbe7fb"/>
<text x="167.4" y="101.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">3,900</text>
<text x="104.0" y="131.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">公积金单位部分</text>
<rect x="112" y="118" width="13.3" height="18" rx="3" fill="#dbe7fb"/>
<text x="131.3" y="131.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">1,050</text>
<text x="104.0" y="161.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">工位与场地</text>
<rect x="112" y="148" width="25.3" height="18" rx="3" fill="#dbe7fb"/>
<text x="143.3" y="161.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">2,000</text>
<text x="104.0" y="191.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">管理与职能分摊</text>
<rect x="112" y="178" width="25.3" height="18" rx="3" fill="#dbe7fb"/>
<text x="143.3" y="191.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">2,000</text>
<text x="104.0" y="221.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">设备与软件</text>
<rect x="112" y="208" width="6.3" height="18" rx="3" fill="#dbe7fb"/>
<text x="124.3" y="221.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">500</text>
<text x="104.0" y="251.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">招聘与培训摊销</text>
<rect x="112" y="238" width="3.8" height="18" rx="3" fill="#dbe7fb"/>
<text x="121.8" y="251.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">300</text>
<text x="104.0" y="281.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">福利与活动</text>
<rect x="112" y="268" width="3.2" height="18" rx="3" fill="#dbe7fb"/>
<text x="121.2" y="281.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">250</text>
<line x1="20" y1="302" x2="340" y2="302" stroke="#d8dee4"/>
<text x="180.0" y="324.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">工资以外的部分 10,000 元，是工资的 67%</text>
<text x="180.0" y="344.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">总花费约为工资的 1.67 倍</text>
<text x="180.0" y="370.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">假设数据：一线城市、税前月薪 1.5 万的办公室岗位</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">一次下载请求：墙钟时间与 CPU 时间</text>
<text x="30" y="60" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">墙钟时间：整个请求约 1 秒（示意）</text>
<rect x="30.0" y="68" width="2.5" height="26" fill="#2f6fdf"/>
<rect x="31.8" y="68" width="10.2" height="26" fill="#e6e9ed"/>
<rect x="42.0" y="68" width="2.5" height="26" fill="#2f6fdf"/>
<rect x="43.2" y="68" width="286.8" height="26" fill="#dbe7fb"/>
<rect x="30" y="68" width="300" height="26" fill="none" stroke="#d8dee4"/>
<text x="210.0" y="85" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">字节从 R2 流向客户端</text>
<text x="30" y="128" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">放大开头的 50 毫秒</text>
<rect x="30.0" y="136" width="36.0" height="26" fill="#2f6fdf"/>
<rect x="66.0" y="136" width="204.0" height="26" fill="#e6e9ed"/>
<rect x="270.0" y="136" width="24.0" height="26" fill="#2f6fdf"/>
<rect x="294.0" y="136" width="36.0" height="26" fill="#dbe7fb"/>
<rect x="30" y="136" width="300" height="26" fill="none" stroke="#d8dee4"/>
<text x="48.0" y="180" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">解析、验令牌</text>
<text x="168.0" y="153" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">等 R2 返回首字节</text>
<text x="330" y="180" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">组装响应头</text>
<line x1="48.0" y1="162" x2="48.0" y2="168" stroke="#656d76"/>
<line x1="282.0" y1="162" x2="282.0" y2="168" stroke="#656d76"/>
<text x="30" y="214" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">计费的 CPU 时间：只有几毫秒</text>
<rect x="30.0" y="222" width="3.0" height="26" fill="#2f6fdf"/>
<rect x="30" y="222" width="300" height="26" fill="none" stroke="#d8dee4"/>
<rect x="40" y="272" width="14" height="14" rx="3" fill="#2f6fdf"/>
<text x="60" y="284" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">CPU 计算</text>
<rect x="145" y="272" width="14" height="14" rx="3" fill="#e6e9ed"/>
<text x="165" y="284" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">等待存储</text>
<rect x="250" y="272" width="14" height="14" rx="3" fill="#dbe7fb"/>
<text x="270" y="284" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">流式传输</text>
<text x="180" y="312" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">等待和流式传输不计 CPU 时间；比例为示意</text>
</svg>

<text x="36" y="268" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">Skill 描述 + MCP 工具名</text>
<text x="36" y="283" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">只有一行描述，正文按需加载</text>

<line x1="262" y1="66" x2="266" y2="66" stroke="#656d76" stroke-width="1.5"/>
<line x1="262" y1="290" x2="266" y2="290" stroke="#656d76" stroke-width="1.5"/>
<text x="276" y="182.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">启动时</text>

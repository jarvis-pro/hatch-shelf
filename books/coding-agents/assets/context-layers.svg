<rect x="24" y="296" width="230" height="92" rx="6" fill="#ffffff" stroke="#2f6fdf" stroke-dasharray="4 3"/>
<text x="36" y="318" font-size="13" fill="#2f6fdf" text-anchor="start" font-weight="600">按需进入</text>

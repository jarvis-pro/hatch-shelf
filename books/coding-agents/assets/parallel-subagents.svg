<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">三项调研：一个会话串行做 vs 子 agent 并行做</text>
<text x="180" y="50" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">示意，不按比例；横向是时间</text>
<text x="20" y="82" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">串行</text>
<rect x="62" y="68" width="64" height="22" rx="4" fill="#dbe7fb"/>
<text x="94" y="83" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">调研 A</text>
<rect x="130" y="68" width="64" height="22" rx="4" fill="#dbe7fb"/>
<text x="162" y="83" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">调研 B</text>
<rect x="198" y="68" width="64" height="22" rx="4" fill="#dbe7fb"/>
<text x="230" y="83" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">调研 C</text>
<rect x="266" y="68" width="64" height="22" rx="4" fill="#2f6fdf"/>
<text x="298" y="83" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">实现</text>
<text x="20" y="128" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">并行</text>
<rect x="62" y="108" width="76" height="22" rx="4" fill="#dbe7fb"/>
<text x="100" y="123" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">子 agent A</text>
<rect x="62" y="134" width="76" height="22" rx="4" fill="#dbe7fb"/>
<text x="100" y="149" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">子 agent B</text>
<rect x="62" y="160" width="76" height="22" rx="4" fill="#dbe7fb"/>
<text x="100" y="175" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">子 agent C</text>
<rect x="142" y="134" width="40" height="22" rx="4" fill="#e6e9ed"/>
<text x="162" y="149" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">汇总</text>
<rect x="186" y="134" width="64" height="22" rx="4" fill="#2f6fdf"/>
<text x="218" y="149" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">实现</text>
<line x1="62" y1="196" x2="340" y2="196" stroke="#d8dee4" stroke-width="1"/>
<text x="20" y="224" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">主会话上下文里留下什么</text>
<text x="20" y="250" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">串行</text>
<rect x="62" y="238" width="260" height="18" rx="3" fill="#e6e9ed"/>
<text x="70" y="251" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">三份调研读过的全部文件和命令输出</text>
<text x="20" y="282" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">并行</text>
<rect x="62" y="270" width="30" height="18" rx="3" fill="#dbe7fb"/>
<rect x="96" y="270" width="30" height="18" rx="3" fill="#dbe7fb"/>
<rect x="130" y="270" width="30" height="18" rx="3" fill="#dbe7fb"/>
<text x="170" y="283" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">三段摘要</text>
<text x="180" y="314" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">并行省的是时间，隔离省的是主会话的上下文</text>
</svg>

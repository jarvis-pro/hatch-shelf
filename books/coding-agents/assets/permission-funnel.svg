<svg xmlns="http://www.w3.org/2000/svg" width="360" height="506" viewBox="0 0 360 506" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif"><rect x="0.5" y="0.5" width="359" height="505" rx="10" fill="#ffffff" stroke="#d8dee4"/><text x="180.0" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">一次工具调用的权限判定（简化）</text><rect x="20" y="50" width="320" height="30" rx="6" fill="#2f6fdf"/><text x="180" y="70" text-anchor="middle" font-size="13" fill="#ffffff">模型请求调用一个工具</text><line x1="100" y1="80" x2="100" y2="94" stroke="#656d76" stroke-width="1.5"/><rect x="20" y="94" width="176" height="40" rx="6" fill="#dbe7fb" stroke="#2f6fdf"/><text x="108" y="119" text-anchor="middle" font-size="12" fill="#1f2328">PreToolUse hook 阻断？</text><line x1="196" y1="114" x2="212" y2="114" stroke="#656d76" stroke-width="1.5"/><text x="204" y="108" text-anchor="middle" font-size="11" fill="#656d76">是</text><rect x="212" y="98" width="128" height="32" rx="6" fill="#e6e9ed"/><text x="276" y="119" text-anchor="middle" font-size="12" fill="#1f2328">拦下并告诉 Claude</text><text x="108" y="148" font-size="11" fill="#656d76">否</text><line x1="100" y1="134" x2="100" y2="148" stroke="#656d76" stroke-width="1.5"/><rect x="20" y="148" width="176" height="40" rx="6" fill="#dbe7fb" stroke="#2f6fdf"/><text x="108" y="173" text-anchor="middle" font-size="12" fill="#1f2328">命中 deny 规则？</text><line x1="196" y1="168" x2="212" y2="168" stroke="#656d76" stroke-width="1.5"/><text x="204" y="162" text-anchor="middle" font-size="11" fill="#656d76">是</text><rect x="212" y="152" width="128" height="32" rx="6" fill="#e6e9ed"/><text x="276" y="173" text-anchor="middle" font-size="12" fill="#1f2328">拒绝，任何模式都算</text><text x="108" y="202" font-size="11" fill="#656d76">否</text><line x1="100" y1="188" x2="100" y2="202" stroke="#656d76" stroke-width="1.5"/><rect x="20" y="202" width="176" height="40" rx="6" fill="#dbe7fb" stroke="#2f6fdf"/><text x="108" y="227" text-anchor="middle" font-size="12" fill="#1f2328">命中 ask 规则？</text><line x1="196" y1="222" x2="212" y2="222" stroke="#656d76" stroke-width="1.5"/><text x="204" y="216" text-anchor="middle" font-size="11" fill="#656d76">是</text><rect x="212" y="206" width="128" height="32" rx="6" fill="#e6e9ed"/><text x="276" y="227" text-anchor="middle" font-size="12" fill="#1f2328">弹出确认问你</text><text x="108" y="256" font-size="11" fill="#656d76">否</text><line x1="100" y1="242" x2="100" y2="256" stroke="#656d76" stroke-width="1.5"/><rect x="20" y="256" width="176" height="40" rx="6" fill="#dbe7fb" stroke="#2f6fdf"/><text x="108" y="281" text-anchor="middle" font-size="12" fill="#1f2328">命中 allow 规则或只读？</text><line x1="196" y1="276" x2="212" y2="276" stroke="#656d76" stroke-width="1.5"/><text x="204" y="270" text-anchor="middle" font-size="11" fill="#656d76">是</text><rect x="212" y="260" width="128" height="32" rx="6" fill="#e6e9ed"/><text x="276" y="281" text-anchor="middle" font-size="12" fill="#1f2328">直接执行</text><text x="108" y="310" font-size="11" fill="#656d76">否</text><line x1="100" y1="296" x2="100" y2="310" stroke="#656d76" stroke-width="1.5"/><rect x="20" y="310" width="320" height="160" rx="6" fill="#ffffff" stroke="#2f6fdf"/><text x="180" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">交给当前权限模式决定</text><text x="36" y="357" font-size="12" fill="#2f6fdf" font-family="Menlo, monospace">default</text><text x="176" y="357" font-size="12" fill="#1f2328">问你</text><text x="36" y="383" font-size="12" fill="#2f6fdf" font-family="Menlo, monospace">acceptEdits</text><text x="176" y="383" font-size="12" fill="#1f2328">文件编辑放行，其余问</text><text x="36" y="409" font-size="12" fill="#2f6fdf" font-family="Menlo, monospace">auto</text><text x="176" y="409" font-size="12" fill="#1f2328">分类器判断</text><text x="36" y="435" font-size="12" fill="#2f6fdf" font-family="Menlo, monospace">dontAsk</text><text x="176" y="435" font-size="12" fill="#1f2328">拒绝</text><text x="36" y="461" font-size="12" fill="#2f6fdf" font-family="Menlo, monospace">bypassPermissions</text><text x="176" y="461" font-size="12" fill="#1f2328">执行</text><text x="180" y="490" text-anchor="middle" font-size="11" fill="#656d76">hook 返回 allow 也绕不过 deny、ask 规则</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="249" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">老公司的出资期限怎么调整</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle">2024 年 7 月 1 日前设立的有限责任公司</text>

<text x="230" y="105" font-size="12" fill="#1f2328" text-anchor="middle">剩余出资期限最长 5 年</text>
<line x1="30" y1="140" x2="330" y2="140" stroke="#656d76"/>
<g font-size="11" fill="#656d76" text-anchor="middle">
<line x1="30" y1="140" x2="30" y2="145" stroke="#656d76"/><text x="30" y="158">2024</text>
<line x1="96.7" y1="140" x2="96.7" y2="145" stroke="#656d76"/><text x="96.7" y="158">2026</text>
<line x1="163.3" y1="140" x2="163.3" y2="145" stroke="#656d76"/><text x="163.3" y="158">2028</text>
<line x1="230" y1="140" x2="230" y2="145" stroke="#656d76"/><text x="230" y="158">2030</text>
<line x1="296.7" y1="140" x2="296.7" y2="145" stroke="#656d76"/><text x="296.7" y="158">2032</text>
</g>
<line x1="46.7" y1="72" x2="46.7" y2="140" stroke="#2f6fdf" stroke-width="2"/>
<line x1="146.7" y1="72" x2="146.7" y2="140" stroke="#2f6fdf" stroke-width="2"/>
<line x1="313.3" y1="72" x2="313.3" y2="140" stroke="#2f6fdf" stroke-width="2"/>
<circle cx="46.7" cy="140" r="4" fill="#2f6fdf"/>
<circle cx="146.7" cy="140" r="4" fill="#2f6fdf"/>
<circle cx="313.3" cy="140" r="4" fill="#2f6fdf"/>
<text x="46.7" y="68" font-size="11" fill="#2f6fdf" text-anchor="middle">2024.7.1</text>
<text x="146.7" y="68" font-size="11" fill="#2f6fdf" text-anchor="middle">2027.6.30</text>
<text x="313.3" y="68" font-size="11" fill="#2f6fdf" text-anchor="end">2032.6.30</text>
<g font-size="12" fill="#1f2328">
<circle cx="30" cy="184" r="4" fill="#2f6fdf"/><text x="42" y="188">2024.7.1　新《公司法》施行，过渡期开始</text>
<circle cx="30" cy="206" r="4" fill="#2f6fdf"/><text x="42" y="210">2027.6.30　过渡期结束，期限要调整完毕</text>
<circle cx="30" cy="228" r="4" fill="#2f6fdf"/><text x="42" y="232">2032.6.30　有限公司最晚的缴足日期</text>

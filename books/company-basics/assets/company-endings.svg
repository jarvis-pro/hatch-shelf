<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">公司的几种终点</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle">示意图，位置表示相对高低，不是量化数据</text>
<rect x="190" y="160" width="150" height="110" fill="#dbe7fb"/>
<rect x="40" y="65" width="150" height="95" fill="#e6e9ed"/>
<line x1="40" y1="270" x2="340" y2="270" stroke="#656d76"/>
<line x1="40" y1="65" x2="40" y2="270" stroke="#656d76"/>
<line x1="190" y1="65" x2="190" y2="270" stroke="#d8dee4" stroke-dasharray="2 3"/>
<line x1="40" y1="160" x2="340" y2="160" stroke="#d8dee4" stroke-dasharray="2 3"/>
<text x="46" y="287" font-size="11" fill="#656d76">被动</text>
<text x="334" y="287" font-size="11" fill="#656d76" text-anchor="end">主动选择</text>
<text x="190" y="287" font-size="11" fill="#656d76" text-anchor="middle">主动程度 →</text>
<text x="30" y="78" font-size="11" fill="#656d76" text-anchor="end" transform="rotate(-90 30 78)">后续麻烦多</text>
<text x="30" y="268" font-size="11" fill="#656d76" transform="rotate(-90 30 268)">少</text>
<g font-size="13" fill="#1f2328">
<circle cx="70" cy="88" r="5" fill="#1f2328"/><text x="80" y="92">放着不管</text>
<circle cx="90" cy="125" r="5" fill="#1f2328"/><text x="100" y="129">被吊销</text>
<circle cx="205" cy="148" r="5" fill="#656d76"/><text x="215" y="152">歇业（推迟决定）</text>
<circle cx="225" cy="188" r="5" fill="#2f6fdf"/><text x="235" y="192">股权转让</text>
<circle cx="250" cy="218" r="5" fill="#2f6fdf"/><text x="260" y="222">简易注销</text>
<circle cx="270" cy="248" r="5" fill="#2f6fdf"/><text x="280" y="252">普通注销</text>
</g>
<g font-size="12" fill="#1f2328">
<rect x="40" y="302" width="14" height="14" fill="#dbe7fb" stroke="#d8dee4"/><text x="60" y="314">主动收尾</text>
<rect x="150" y="302" width="14" height="14" fill="#e6e9ed" stroke="#d8dee4"/><text x="170" y="314">风险长期跟着你</text>
</g>
</svg>

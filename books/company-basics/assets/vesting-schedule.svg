<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">周舟 30% 人力股的兑现进度</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle">4 年兑现、1 年悬崖（假设的例子）</text>
<g stroke="#d8dee4">
<line x1="50" y1="230" x2="330" y2="230"/>
<line x1="50" y1="176.7" x2="330" y2="176.7" stroke-dasharray="2 3"/>
<line x1="50" y1="123.3" x2="330" y2="123.3" stroke-dasharray="2 3"/>
<line x1="50" y1="70" x2="330" y2="70" stroke-dasharray="2 3"/>
</g>
<g font-size="11" fill="#656d76" text-anchor="end">
<text x="44" y="234">0</text>
<text x="44" y="180.7">10%</text>
<text x="44" y="127.3">20%</text>
<text x="44" y="74">30%</text>
</g>
<g font-size="11" fill="#656d76" text-anchor="middle">
<text x="50" y="248">0</text>
<text x="120" y="248">12</text>
<text x="190" y="248">24</text>
<text x="260" y="248">36</text>
<text x="330" y="248">48</text>
<text x="190" y="266">月份</text>
</g>
<rect x="50" y="70" width="70" height="160" fill="#e6e9ed" opacity="0.6"/>
<text x="85" y="150" font-size="12" fill="#656d76" text-anchor="middle">悬崖期</text>
<polyline points="50,230 120,230 120,190 330,70" fill="none" stroke="#2f6fdf" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="120" cy="190" r="4" fill="#2f6fdf"/>
<circle cx="155" cy="170" r="4" fill="#2f6fdf"/>
<circle cx="330" cy="70" r="4" fill="#2f6fdf"/>
<text x="126" y="206" font-size="12" fill="#1f2328">7.5%</text>
<text x="160" y="186" font-size="12" fill="#1f2328">第 18 个月 11.25%</text>
<text x="318" y="64" font-size="12" fill="#1f2328" text-anchor="end">第 48 个月 30%</text>
<g font-size="12" fill="#1f2328">
<rect x="24" y="284" width="14" height="4" fill="#2f6fdf"/><text x="46" y="290">已兑现的人力股（占公司股权）</text>
<rect x="24" y="302" width="14" height="14" fill="#e6e9ed"/><text x="46" y="313">满 12 个月前离开，人力股一点都拿不到</text>
</g>
</svg>

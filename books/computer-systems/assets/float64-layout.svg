<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" width="360" height="366"><rect x="0.5" y="0.5" width="359" height="365" rx="10" fill="#ffffff" stroke="#d8dee4"/><text x="20" y="32" font-size="15" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">IEEE 754 双精度浮点（64 位）</text><rect x="20" y="52" width="28" height="34" fill="#2f6fdf" stroke="#d8dee4"/><text x="34.0" y="74" font-size="13" fill="#ffffff" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">s</text><rect x="48" y="52" width="88" height="34" fill="#dbe7fb" stroke="#d8dee4"/><text x="92.0" y="74" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">指数 e</text><rect x="136" y="52" width="204" height="34" fill="#e6e9ed" stroke="#d8dee4"/><text x="238.0" y="74" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">尾数 f</text><text x="34" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">1 位</text><text x="92" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">11 位</text><text x="238" y="104" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">52 位（另有隐含的 1）</text><text x="180" y="134" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">值 = (−1)ˢ × 1.f × 2^(e − 1023)</text><line x1="20" y1="152" x2="340" y2="152" stroke="#d8dee4"/><text x="20" y="178" font-size="14" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">例：0.1 = 0x3FB999999999999A</text><text x="20" y="204" font-size="12" fill="#656d76" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">符号</text><text x="60" y="204" font-size="12" fill="#2f6fdf" text-anchor="start" font-family="Menlo, 'SF Mono', monospace">0</text><text x="60" y="221" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">正数</text><text x="20" y="244" font-size="12" fill="#656d76" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">指数</text><text x="60" y="244" font-size="12" fill="#2f6fdf" text-anchor="start" font-family="Menlo, 'SF Mono', monospace">01111111011</text><text x="60" y="261" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">1019 − 1023 = −4</text><text x="20" y="284" font-size="12" fill="#656d76" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">尾数</text><text x="60" y="284" font-size="12" fill="#2f6fdf" text-anchor="start" font-family="Menlo, 'SF Mono', monospace">1001 1001 … 1001 1010</text><text x="60" y="301" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">末尾舍入进了一位</text><text x="20" y="328" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">实际存的值 1.6000000000000000888 × 2⁻⁴</text><text x="20" y="346" font-size="12" fill="#2f6fdf" text-anchor="start" font-family="Menlo, 'SF Mono', monospace">= 0.1000000000000000055511…</text></svg>
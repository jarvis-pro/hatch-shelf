<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300"><rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/><text x="20" y="30" font-size="15" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">x86-64 虚拟地址怎么拆（4 KB 页）</text><text x="20" y="50" font-size="12" fill="#656d76" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">低 48 位有效，从左到右依次查四级页表</text><rect x="20.0" y="70" width="60.0" height="40" fill="#dbe7fb" stroke="#ffffff" stroke-width="2"/><text x="50.0" y="88" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">L4</text><text x="50.0" y="103" font-size="11" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">9 位</text><text x="50.0" y="126" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">47–39</text><rect x="80.0" y="70" width="60.0" height="40" fill="#dbe7fb" stroke="#ffffff" stroke-width="2"/><text x="110.0" y="88" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">L3</text><text x="110.0" y="103" font-size="11" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">9 位</text><text x="110.0" y="126" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">38–30</text><rect x="140.0" y="70" width="60.0" height="40" fill="#dbe7fb" stroke="#ffffff" stroke-width="2"/><text x="170.0" y="88" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">L2</text><text x="170.0" y="103" font-size="11" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">9 位</text><text x="170.0" y="126" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">29–21</text><rect x="200.0" y="70" width="60.0" height="40" fill="#dbe7fb" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="88" font-size="13" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">L1</text><text x="230.0" y="103" font-size="11" fill="#1f2328" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">9 位</text><text x="230.0" y="126" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">20–12</text><rect x="260.0" y="70" width="80.0" height="40" fill="#2f6fdf" stroke="#ffffff" stroke-width="2"/><text x="300.0" y="88" font-size="13" fill="#ffffff" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif" font-weight="600">页内偏移</text><text x="300.0" y="103" font-size="11" fill="#ffffff" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">12 位</text><text x="300.0" y="126" font-size="11" fill="#656d76" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">11–0</text><circle cx="26" cy="158" r="2.5" fill="#2f6fdf"/><text x="36" y="162" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">每级 9 位：一张页表 512 项 × 8 字节 = 4 KB</text><circle cx="26" cy="182" r="2.5" fill="#2f6fdf"/><text x="36" y="186" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">四级逐级查下去，最后一项给出物理页号</text><circle cx="26" cy="206" r="2.5" fill="#2f6fdf"/><text x="36" y="210" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">物理页号 + 12 位偏移 = 物理地址</text><circle cx="26" cy="230" r="2.5" fill="#2f6fdf"/><text x="36" y="234" font-size="12" fill="#1f2328" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">2⁴⁸ 字节 = 256 TB 的虚拟地址空间</text><line x1="20" y1="252" x2="340" y2="252" stroke="#d8dee4"/><text x="20" y="272" font-size="12" fill="#656d76" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">TLB 缓存最近的翻译结果，命中时一步到位</text><text x="20" y="290" font-size="12" fill="#656d76" text-anchor="start" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">Apple Silicon 的 macOS / iOS 用 16 KB 页，偏移是 14 位</text></svg>
<text x="70" y="184" font-size="13" fill="#1f2328" text-anchor="end">99.95%</text>
<rect x="78" y="169" width="11.6" height="22" rx="3" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>
<text x="95.6" y="184" font-size="12" fill="#1f2328">21.6 分钟</text>

<text x="199.0" y="236" font-size="11" fill="#656d76" text-anchor="middle">每月最多停机（分钟）</text>
<text x="70" y="91" font-size="13" fill="#1f2328" text-anchor="end">99%</text>
<rect x="78" y="76" width="232.3" height="22" rx="3" fill="#2f6fdf" stroke="#2f6fdf" stroke-width="0"/>
<text x="86" y="91" font-size="12" fill="#ffffff">432 分钟（7.2 小时）</text>
<text x="70" y="122" font-size="13" fill="#1f2328" text-anchor="end">99.5%</text>
<rect x="78" y="107" width="116.2" height="22" rx="3" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>

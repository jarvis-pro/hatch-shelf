<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">确认框的三个部分</text>
<rect x="20" y="52" width="210" height="196" rx="10" fill="#ffffff" stroke="#656d76"/>
<text x="36" y="86" font-size="14" font-weight="600" fill="#1f2328">删掉「肉类」？</text>
<text x="36" y="118" font-size="12" fill="#1f2328">这一类下面记过开支，</text>
<text x="36" y="136" font-size="12" fill="#1f2328">要先挑一个去处，</text>
<text x="36" y="154" font-size="12" fill="#1f2328">挪过去再删掉。</text>
<rect x="36" y="196" width="72" height="32" rx="6" fill="#e6e9ed"/>
<text x="72" y="217" font-size="12" fill="#1f2328" text-anchor="middle">取消</text>
<rect x="116" y="196" width="98" height="32" rx="6" fill="#2f6fdf"/>
<text x="165" y="217" font-size="12" fill="#ffffff" text-anchor="middle">挪过去再删掉</text>
<line x1="232" y1="82" x2="248" y2="82" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="254" y="80" font-size="13" font-weight="600" fill="#2f6fdf">① 标题</text>
<text x="254" y="97" font-size="12" fill="#656d76">要做的事，问句</text>
<line x1="232" y1="136" x2="248" y2="136" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="254" y="134" font-size="13" font-weight="600" fill="#2f6fdf">② 正文</text>
<text x="254" y="151" font-size="12" fill="#656d76">后果、能否撤回</text>
<line x1="232" y1="212" x2="248" y2="212" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="254" y="210" font-size="13" font-weight="600" fill="#2f6fdf">③ 按钮</text>
<text x="254" y="227" font-size="12" fill="#656d76">重复动作，写到底</text>
<text x="180" y="278" font-size="12" fill="#656d76" text-anchor="middle">三处说的是同一件事，正文按实际情况算出来</text>
</svg>

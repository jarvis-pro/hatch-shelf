<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="379" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">着陆页从上到下</text>
<text x="108" y="48" font-size="11" fill="#656d76" text-anchor="middle">页面分段</text>
<text x="282" y="48" font-size="11" fill="#656d76" text-anchor="middle">访客心里的问题</text>
<rect x="20" y="56" width="196" height="40" rx="6" fill="#2f6fdf"/>
<text x="30" y="73" font-size="13" font-weight="600" fill="#ffffff">首屏</text>
<text x="30" y="89" font-size="11" fill="#ffffff">小标题 · 主标题 · 主行动</text>
<line x1="220" y1="76.0" x2="232" y2="76.0" stroke="#d8dee4" stroke-width="1.5"/>
<text x="236" y="80.0" font-size="12" fill="#1f2328">跟我有关吗？</text>
<rect x="20" y="104" width="196" height="40" rx="6" fill="#e6e9ed"/>
<text x="30" y="121" font-size="13" font-weight="600" fill="#1f2328">功能段</text>
<text x="30" y="137" font-size="11" fill="#656d76">每段一个主题，动作 + 结果</text>
<line x1="220" y1="124.0" x2="232" y2="124.0" stroke="#d8dee4" stroke-width="1.5"/>
<text x="236" y="128.0" font-size="12" fill="#1f2328">能帮我做什么？</text>
<rect x="20" y="152" width="196" height="40" rx="6" fill="#e6e9ed"/>
<text x="30" y="169" font-size="13" font-weight="600" fill="#1f2328">证据</text>
<text x="30" y="185" font-size="11" fill="#656d76">截图 · 用户原话 · 局限</text>
<line x1="220" y1="172.0" x2="232" y2="172.0" stroke="#d8dee4" stroke-width="1.5"/>
<text x="236" y="176.0" font-size="12" fill="#1f2328">凭什么信你？</text>
<rect x="20" y="200" width="196" height="40" rx="6" fill="#dbe7fb"/>
<text x="30" y="217" font-size="13" font-weight="600" fill="#1f2328">开始用</text>
<text x="30" y="233" font-size="11" fill="#656d76">拆成几步，联系方式就在第一步</text>
<line x1="220" y1="220.0" x2="232" y2="220.0" stroke="#d8dee4" stroke-width="1.5"/>
<text x="236" y="224.0" font-size="12" fill="#1f2328">怎么开始？</text>
<rect x="20" y="248" width="196" height="40" rx="6" fill="#e6e9ed"/>
<text x="30" y="265" font-size="13" font-weight="600" fill="#1f2328">常见问题</text>
<text x="30" y="281" font-size="11" fill="#656d76">来自真实咨询</text>
<line x1="220" y1="268.0" x2="232" y2="268.0" stroke="#d8dee4" stroke-width="1.5"/>
<text x="236" y="272.0" font-size="12" fill="#1f2328">还有什么顾虑？</text>
<rect x="20" y="296" width="196" height="40" rx="6" fill="#e6e9ed"/>
<text x="30" y="313" font-size="13" font-weight="600" fill="#1f2328">结尾行动</text>
<text x="30" y="329" font-size="11" fill="#656d76">再给一次主行动</text>
<line x1="220" y1="316.0" x2="232" y2="316.0" stroke="#d8dee4" stroke-width="1.5"/>
<text x="236" y="320.0" font-size="12" fill="#1f2328">好，试试</text>
<text x="180" y="366" font-size="11" fill="#656d76" text-anchor="middle">深蓝块：首屏决定去留；浅蓝块：把路铺到最后一步</text>
</svg>
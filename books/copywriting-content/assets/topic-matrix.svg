<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="339" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">选题矩阵</text>
<rect x="56" y="48" width="134" height="118" rx="8" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="123.0" y="105.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">容易写成自嗨</text>
<text x="123.0" y="125.0" font-size="11" fill="#656d76" text-anchor="middle">你懂，读者不关心</text>
<rect x="194" y="48" width="134" height="118" rx="8" fill="#2f6fdf" stroke="#d8dee4"/>
<text x="261.0" y="105.0" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">优先写</text>
<text x="261.0" y="125.0" font-size="11" fill="#ffffff" text-anchor="middle">你懂，读者关心</text>
<rect x="56" y="170" width="134" height="118" rx="8" fill="#ffffff" stroke="#d8dee4"/>
<text x="123.0" y="227.0" font-size="14" font-weight="600" fill="#656d76" text-anchor="middle">不写</text>
<text x="123.0" y="247.0" font-size="11" fill="#656d76" text-anchor="middle">你不懂，读者也不关心</text>
<rect x="194" y="170" width="134" height="118" rx="8" fill="#dbe7fb" stroke="#d8dee4"/>
<text x="261.0" y="227.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">先补功课再写</text>
<text x="261.0" y="247.0" font-size="11" fill="#656d76" text-anchor="middle">读者关心，你还不懂</text>
<line x1="56" y1="300" x2="328" y2="300" stroke="#656d76" stroke-width="1.2"/>
<polygon points="328,296 336,300 328,304" fill="#656d76"/>
<text x="192" y="320" font-size="12" fill="#656d76" text-anchor="middle">读者有多关心</text>
<line x1="44" y1="288" x2="44" y2="48" stroke="#656d76" stroke-width="1.2"/>
<polygon points="40,48 44,40 48,48" fill="#656d76"/>
<text x="32" y="168" font-size="12" fill="#656d76" text-anchor="middle" transform="rotate(-90 32 168)">你有多懂</text>
</svg>
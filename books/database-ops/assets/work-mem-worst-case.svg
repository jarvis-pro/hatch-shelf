<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" width="360" height="302" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="301" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">work_mem 最坏情况估算</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">按每个查询 2 个排序 / 哈希节点计算</text>
<text x="24" y="78" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">20 连接 × 16MB</text>
<rect x="24" y="86" width="15.0" height="20" rx="4" fill="#2f6fdf" stroke="#2f6fdf" stroke-width="0"/>
<text x="45.0" y="101" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">640MB</text>
<line x1="120.0" y1="82" x2="120.0" y2="110" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="24" y="134" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">100 连接 × 16MB</text>
<rect x="24" y="142" width="75.0" height="20" rx="4" fill="#2f6fdf" stroke="#2f6fdf" stroke-width="0"/>
<text x="93.0" y="157" font-size="12" fill="#ffffff" text-anchor="end" font-weight="600">约 3.1GB</text>
<line x1="120.0" y1="138" x2="120.0" y2="166" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="24" y="190" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">100 连接 × 64MB</text>
<rect x="24" y="198" width="300.0" height="20" rx="4" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>
<text x="318.0" y="213" font-size="12" fill="#1f2328" text-anchor="end" font-weight="600">约 12.5GB</text>
<line x1="120.0" y1="194" x2="120.0" y2="222" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="120.0" y="240" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">↑ 机器内存 4GB</text>
<rect x="60" y="270" width="14" height="14" rx="3" fill="#2f6fdf"/><text x="80" y="282" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">低于机器内存</text>
<rect x="160" y="270" width="14" height="14" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/><text x="180" y="282" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">超出机器内存</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
  <rect x="0.5" y="0.5" width="359" height="399" rx="10" fill="#ffffff" stroke="#d8dee4"/>
  <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">一段会话日志：哪些事件进入模型</text>
  <text x="24" y="54" font-size="11" fill="#656d76">序号</text>
  <text x="56" y="54" font-size="11" fill="#656d76">事件</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#656d76">模型看得到吗</text>

  <!-- row template: y base = 64 + i*32 -->
  <g font-size="12">
    <!-- 0 -->
    <rect x="16" y="64" width="328" height="26" rx="5" fill="#ffffff" stroke="#d8dee4"/>
    <text x="28" y="81" fill="#656d76">0</text>
    <text x="56" y="81" fill="#1f2328">turn/start</text>
    <rect x="262" y="69" width="76" height="16" rx="8" fill="#e6e9ed"/>
    <text x="300" y="81" text-anchor="middle" font-size="11" fill="#656d76">只记录</text>
    <!-- 1 -->
    <rect x="16" y="96" width="328" height="26" rx="5" fill="#ffffff" stroke="#d8dee4"/>
    <text x="28" y="113" fill="#656d76">1</text>
    <text x="56" y="113" fill="#1f2328">system/message 系统提示词</text>
    <rect x="262" y="101" width="76" height="16" rx="8" fill="#dbe7fb"/>
    <text x="300" y="113" text-anchor="middle" font-size="11" fill="#2f6fdf">进入模型</text>
    <!-- 2 -->
    <rect x="16" y="128" width="328" height="26" rx="5" fill="#ffffff" stroke="#d8dee4"/>
    <text x="28" y="145" fill="#656d76">2</text>
    <text x="56" y="145" fill="#1f2328">user/message 你的任务</text>
    <rect x="262" y="133" width="76" height="16" rx="8" fill="#dbe7fb"/>
    <text x="300" y="145" text-anchor="middle" font-size="11" fill="#2f6fdf">进入模型</text>
    <!-- 3 -->
    <rect x="16" y="160" width="328" height="26" rx="5" fill="#ffffff" stroke="#d8dee4"/>
    <text x="28" y="177" fill="#656d76">3</text>
    <text x="56" y="177" fill="#1f2328">step/start</text>
    <rect x="262" y="165" width="76" height="16" rx="8" fill="#e6e9ed"/>
    <text x="300" y="177" text-anchor="middle" font-size="11" fill="#656d76">只记录</text>
    <!-- 4 shadowed -->
    <rect x="16" y="192" width="328" height="26" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-dasharray="4 3"/>
    <text x="28" y="209" fill="#656d76">4</text>
    <text x="56" y="209" fill="#656d76">assistant/message 要读 README</text>
    <text x="300" y="209" text-anchor="middle" font-size="11" fill="#656d76">被摘要遮住</text>
    <!-- 5 -->
    <rect x="16" y="224" width="328" height="26" rx="5" fill="#ffffff" stroke="#d8dee4"/>
    <text x="28" y="241" fill="#656d76">5</text>
    <text x="56" y="241" fill="#1f2328">tool/call read</text>
    <rect x="262" y="229" width="76" height="16" rx="8" fill="#e6e9ed"/>
    <text x="300" y="241" text-anchor="middle" font-size="11" fill="#656d76">只记录</text>
    <!-- 6 shadowed -->
    <rect x="16" y="256" width="328" height="26" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-dasharray="4 3"/>
    <text x="28" y="273" fill="#656d76">6</text>
    <text x="56" y="273" fill="#656d76">tool/result README 全文</text>
    <text x="300" y="273" text-anchor="middle" font-size="11" fill="#656d76">被摘要遮住</text>
    <!-- 7 -->
    <rect x="16" y="288" width="328" height="26" rx="5" fill="#ffffff" stroke="#d8dee4"/>
    <text x="28" y="305" fill="#656d76">7</text>
    <text x="56" y="305" fill="#1f2328">compaction/summary</text>
    <rect x="262" y="293" width="76" height="16" rx="8" fill="#e6e9ed"/>
    <text x="300" y="305" text-anchor="middle" font-size="11" fill="#656d76">只记录</text>
    <!-- 8 summary -->
    <rect x="16" y="320" width="328" height="26" rx="5" fill="#dbe7fb" stroke="#2f6fdf"/>
    <text x="28" y="337" fill="#2f6fdf">8</text>
    <text x="56" y="337" fill="#1f2328">user/message 摘要，替换 4–6</text>
    <rect x="262" y="325" width="76" height="16" rx="8" fill="#ffffff"/>
    <text x="300" y="337" text-anchor="middle" font-size="11" fill="#2f6fdf">进入模型</text>
  </g>

  <text x="24" y="368" font-size="11" fill="#656d76">日志只追加、不修改；模型看到的是 1、2、8 三条。</text>
  <text x="24" y="386" font-size="11" fill="#656d76">4 和 6 仍在日志里，回放时能看到压缩前的原文。</text>
</svg>

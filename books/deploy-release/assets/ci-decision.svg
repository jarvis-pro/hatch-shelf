<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" width="360" height="368" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="367" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">一个人什么时候值得上 CI</text>
<rect x="59.0" y="55.0" width="136.0" height="122.0" rx="8" fill="#dbe7fb"/>
<text x="69.0" y="81.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">发版时跑完整检查</text>
<text x="69.0" y="105.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">推送不跑，发版流水线</text>
<text x="69.0" y="123.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">里 lint / 测试 / 构建</text>
<text x="69.0" y="141.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">（hatch-counter）</text>
<rect x="201.0" y="55.0" width="136.0" height="122.0" rx="8" fill="#2f6fdf"/>
<text x="211.0" y="81.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600">PR 检查 + 发版流水线</text>
<text x="211.0" y="105.0" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">每个 PR 都过检查，</text>
<text x="211.0" y="123.0" font-size="11" fill="#ffffff" text-anchor="start" font-weight="normal">发版再完整跑一遍</text>
<rect x="59.0" y="183.0" width="136.0" height="122.0" rx="8" fill="#f6f8fa"/>
<text x="69.0" y="209.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">本机检查就够</text>
<text x="69.0" y="233.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">提交前跑 typecheck</text>
<text x="69.0" y="251.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">和 test，可加 git hook</text>
<text x="69.0" y="269.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">（唱片墙、书架）</text>
<rect x="201.0" y="183.0" width="136.0" height="122.0" rx="8" fill="#dbe7fb"/>
<text x="211.0" y="209.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">PR 上跑轻量 CI</text>
<text x="211.0" y="233.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">lint / 类型 / 单测，</text>
<text x="211.0" y="251.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">先筛掉明显的错</text>
<line x1="56" y1="316" x2="340" y2="316" stroke="#656d76"/>
<polygon points="340,312 346,316 340,320" fill="#656d76"/>
<text x="56" y="334" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">只有自己</text>
<text x="340" y="334" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">有协作者 / 后台 agent</text>
<text x="198.0" y="352" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">改动从哪来</text>
<line x1="48" y1="308" x2="48" y2="52" stroke="#656d76"/>
<polygon points="44,52 48,46 52,52" fill="#656d76"/>
<text x="42" y="308" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">低</text>
<text x="42" y="64" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">高</text>
<text x="24" y="180.0" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle" transform="rotate(-90 24 180.0)">出错代价</text>
</svg>

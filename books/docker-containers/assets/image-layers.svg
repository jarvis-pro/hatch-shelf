<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="339" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">一个 Node 服务容器的文件系统</text>
<rect x="24" y="50" width="312" height="40" rx="6" fill="#ffffff" stroke="#2f6fdf" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="36" y="70" font-size="13" font-weight="600" fill="#2f6fdf">可写层（容器）</text>
<text x="36" y="84" font-size="11" fill="#656d76">运行时的改动、日志、临时文件；删容器即消失</text>
<text x="324" y="74" font-size="12" fill="#656d76" text-anchor="end">读写</text>
<rect x="24" y="102" width="312" height="34" rx="6" fill="#2f6fdf"/>
<text x="36" y="124" font-size="13" fill="#ffffff">COPY dist：编译产物</text>
<text x="324" y="124" font-size="12" fill="#ffffff" text-anchor="end">变化最频繁</text>
<rect x="24" y="142" width="312" height="34" rx="6" fill="#2f6fdf" fill-opacity="0.75"/>
<text x="36" y="164" font-size="13" fill="#ffffff">RUN pnpm install：node_modules</text>
<rect x="24" y="182" width="312" height="34" rx="6" fill="#dbe7fb"/>
<text x="36" y="204" font-size="13" fill="#1f2328">COPY package.json / lockfile</text>
<rect x="24" y="222" width="312" height="34" rx="6" fill="#e6e9ed"/>
<text x="36" y="244" font-size="13" fill="#1f2328">node:22-alpine：Node 运行时</text>
<rect x="24" y="262" width="312" height="34" rx="6" fill="#e6e9ed"/>
<text x="36" y="284" font-size="13" fill="#1f2328">Alpine 基础系统</text>
<text x="324" y="284" font-size="12" fill="#656d76" text-anchor="end">最稳定</text>
<line x1="24" y1="96" x2="336" y2="96" stroke="#d8dee4"/>
<rect x="24" y="310" width="12" height="12" rx="2" fill="#2f6fdf"/>
<text x="42" y="321" font-size="12" fill="#656d76">自己的层</text>
<rect x="120" y="310" width="12" height="12" rx="2" fill="#e6e9ed"/>
<text x="138" y="321" font-size="12" fill="#656d76">基础镜像的层（只读、共享）</text>
</svg>

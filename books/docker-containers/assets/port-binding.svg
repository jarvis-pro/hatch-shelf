<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fdf"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#656d76"/></marker>
</defs>
<rect x="0.5" y="0.5" width="359" height="379" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">三种端口写法，谁能访问到</text>
<rect x="16" y="48" width="64" height="300" rx="8" fill="#e6e9ed"/>
<text x="48" y="190" font-size="13" fill="#1f2328" text-anchor="middle">公网</text>
<text x="48" y="208" font-size="11" fill="#656d76" text-anchor="middle">任意来源</text>
<rect x="96" y="48" width="248" height="300" rx="8" fill="#ffffff" stroke="#d8dee4"/>
<text x="108" y="66" font-size="12" fill="#656d76">宿主机</text>
<!-- row 1 -->
<text x="108" y="92" font-size="12" font-weight="600" fill="#1f2328">"3000:3000"</text>
<rect x="250" y="78" width="82" height="30" rx="6" fill="#2f6fdf"/>
<text x="291" y="98" font-size="12" fill="#ffffff" text-anchor="middle">api 容器</text>
<line x1="80" y1="100" x2="246" y2="100" stroke="#2f6fdf" stroke-width="1.5" marker-end="url(#a)"/>
<text x="108" y="124" font-size="11" fill="#656d76">绑 0.0.0.0：公网直连，没有 TLS</text>
<line x1="108" y1="140" x2="332" y2="140" stroke="#d8dee4"/>
<!-- row 2 -->
<text x="108" y="166" font-size="12" font-weight="600" fill="#1f2328">"127.0.0.1:3000:3000"</text>
<rect x="108" y="178" width="70" height="30" rx="6" fill="#dbe7fb"/>
<text x="143" y="198" font-size="12" fill="#1f2328" text-anchor="middle">nginx</text>
<rect x="250" y="178" width="82" height="30" rx="6" fill="#2f6fdf"/>
<text x="291" y="198" font-size="12" fill="#ffffff" text-anchor="middle">api 容器</text>
<line x1="80" y1="193" x2="104" y2="193" stroke="#2f6fdf" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="178" y1="193" x2="246" y2="193" stroke="#2f6fdf" stroke-width="1.5" marker-end="url(#a)"/>
<text x="212" y="187" font-size="11" fill="#656d76" text-anchor="middle">本机</text>
<text x="108" y="226" font-size="11" fill="#656d76">只有宿主机进程能连，TLS 在 nginx 终止</text>
<line x1="108" y1="242" x2="332" y2="242" stroke="#d8dee4"/>
<!-- row 3 -->
<text x="108" y="268" font-size="12" font-weight="600" fill="#1f2328">不写 ports</text>
<rect x="108" y="280" width="70" height="30" rx="6" fill="#2f6fdf"/>
<text x="143" y="300" font-size="12" fill="#ffffff" text-anchor="middle">api</text>
<rect x="250" y="280" width="82" height="30" rx="6" fill="#e6e9ed"/>
<text x="291" y="300" font-size="12" fill="#1f2328" text-anchor="middle">postgres</text>
<line x1="178" y1="295" x2="246" y2="295" stroke="#656d76" stroke-width="1.5" marker-end="url(#g)"/>
<text x="212" y="289" font-size="11" fill="#656d76" text-anchor="middle">内网</text>
<text x="108" y="328" font-size="11" fill="#656d76">只有同一 compose 网络的容器能连</text>
<text x="180" y="368" font-size="11" fill="#656d76" text-anchor="middle">注意：0.0.0.0 发布的端口会绕过宿主机 ufw</text>
</svg>

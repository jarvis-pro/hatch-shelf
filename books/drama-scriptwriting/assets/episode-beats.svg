<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="249" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2328">一集约 2 分钟的四个节拍</text>
<text x="16" y="45" font-size="11" fill="#656d76">本书的写作参考，按 120 秒计</text>
<rect x="20.0" y="62" width="24.7" height="34" rx="4" fill="#2f6fdf"/>
<text x="32.3" y="84" font-size="12" fill="#ffffff" text-anchor="middle">承接</text>
<rect x="46.7" y="62" width="131.3" height="34" rx="4" fill="#dbe7fb"/>
<text x="112.3" y="84" font-size="12" fill="#1f2328" text-anchor="middle">推进</text>
<rect x="180.0" y="62" width="104.7" height="34" rx="4" fill="#dbe7fb"/>
<text x="232.3" y="84" font-size="12" fill="#1f2328" text-anchor="middle">转折</text>
<rect x="286.7" y="62" width="51.3" height="34" rx="4" fill="#2f6fdf"/>
<text x="312.3" y="84" font-size="12" fill="#ffffff" text-anchor="middle">钩子</text>
<text x="20.0" y="112" font-size="11" fill="#656d76" text-anchor="middle">0s</text>
<text x="46.7" y="112" font-size="11" fill="#656d76" text-anchor="middle">10s</text>
<text x="180.0" y="112" font-size="11" fill="#656d76" text-anchor="middle">60s</text>
<text x="286.7" y="112" font-size="11" fill="#656d76" text-anchor="middle">100s</text>
<text x="340" y="112" font-size="11" fill="#656d76" text-anchor="end">120s</text>
<text x="20" y="140" font-size="12" font-weight="600" fill="#1f2328">0–10 秒</text>
<text x="96" y="140" font-size="12" fill="#1f2328">接住上集钩子，或直接抛出冲突</text>
<text x="20" y="164" font-size="12" font-weight="600" fill="#1f2328">10–60 秒</text>
<text x="96" y="164" font-size="12" fill="#1f2328">一次对抗或揭露，局面开始变化</text>
<text x="20" y="188" font-size="12" font-weight="600" fill="#1f2328">60–100 秒</text>
<text x="96" y="188" font-size="12" fill="#1f2328">反转、反击或决定，局面翻过来</text>
<text x="20" y="212" font-size="12" font-weight="600" fill="#1f2328">100–120 秒</text>
<text x="96" y="212" font-size="12" fill="#1f2328">停在「然后呢」：新问题出现</text>
</svg>
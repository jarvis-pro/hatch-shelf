<svg xmlns="http://www.w3.org/2000/svg" width="360" height="372" viewBox="0 0 360 372" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="371" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="20" y="30" font-size="15" font-weight="600" fill="#1f2328">一单 79 元的钱去了哪里</text>
<text x="20" y="48" font-size="12" fill="#656d76">自营小店示例，按每成交一单（未退货）摊算，单位：元</text>
<rect x="112" y="68" width="200.0" height="22" rx="3" fill="#dbe7fb"/>
<text x="306.0" y="83" font-size="12" font-weight="600" fill="#1f2328" text-anchor="end">79.00</text>
<text x="20" y="83" font-size="12" fill="#1f2328">售价</text>
<rect x="252.6" y="104" width="59.4" height="22" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="246.6" y="119" font-size="12" fill="#1f2328" text-anchor="end">−23.47</text>
<text x="20" y="119" font-size="12" fill="#1f2328">商品成本</text>
<rect x="234.0" y="140" width="18.6" height="22" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="228.0" y="155" font-size="12" fill="#1f2328" text-anchor="end">−7.33</text>
<text x="20" y="155" font-size="12" fill="#1f2328">物流与运费险</text>
<rect x="224.0" y="176" width="10.0" height="22" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="218.0" y="191" font-size="12" fill="#1f2328" text-anchor="end">−3.95</text>
<text x="20" y="191" font-size="12" fill="#1f2328">平台技术服务费</text>
<rect x="184.0" y="212" width="40.0" height="22" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="178.0" y="227" font-size="12" fill="#1f2328" text-anchor="end">−15.80</text>
<text x="20" y="227" font-size="12" fill="#1f2328">达人佣金</text>
<rect x="143.5" y="248" width="40.5" height="22" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="190.0" y="263" font-size="12" fill="#1f2328">−16.00</text>
<text x="20" y="263" font-size="12" fill="#1f2328">投流</text>
<rect x="112" y="284" width="31.5" height="22" rx="3" fill="#2f6fdf"/>
<text x="149.5" y="299" font-size="12" font-weight="600" fill="#2f6fdf">12.45（15.8%）</text>
<text x="20" y="299" font-size="12" font-weight="600" fill="#1f2328">净利润</text>
<text x="20" y="328" font-size="11" fill="#656d76">假设：进价 22、快递包装 5、运费险 0.5、技术服务费 5%、</text>
<text x="20" y="344" font-size="11" fill="#656d76">佣金 20%、投流 12 元/单、退货率 25%，退回货 20% 不能再卖</text>
</svg>
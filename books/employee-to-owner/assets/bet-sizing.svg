<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 446" width="360" height="446" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="445" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">同一个好赌局，押多少决定结局</text>
<text x="16" y="47" font-size="12" fill="#656d76">本金 10 万，连赌 5 轮；每轮赢的概率 60%</text>
<text x="16" y="64" font-size="12" fill="#656d76">赢了押注翻倍，输了押注没收</text>
<text x="16" y="90" font-size="13" font-weight="600" fill="#1f2328">A. 每轮全部押上</text>
<text x="344" y="90" font-size="12" fill="#656d76" text-anchor="end">期望 24.9 万</text>
<text x="16" y="114" font-size="11" fill="#656d76">5 轮后剩</text>
<text x="114" y="114" font-size="11" fill="#656d76">出现的概率</text>
<text x="16" y="135" font-size="12" fill="#1f2328">归零</text>
<rect x="114" y="122" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="122" width="166.0" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="135" font-size="12" fill="#1f2328">92.2%</text>
<text x="16" y="161" font-size="12" fill="#1f2328">320 万</text>
<rect x="114" y="148" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="148" width="14.0" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="161" font-size="12" fill="#1f2328">7.8%</text>
<text x="16" y="192" font-size="13" font-weight="600" fill="#1f2328">B. 每轮只押当时的 20%</text>
<text x="344" y="192" font-size="12" fill="#656d76" text-anchor="end">期望 12.2 万</text>
<text x="16" y="216" font-size="11" fill="#656d76">5 轮后剩</text>
<text x="114" y="216" font-size="11" fill="#656d76">出现的概率</text>
<text x="16" y="237" font-size="12" fill="#1f2328">3.3 万（赢0次）</text>
<rect x="114" y="224" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="224" width="2.0" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="237" font-size="12" fill="#1f2328">1.0%</text>
<text x="16" y="263" font-size="12" fill="#1f2328">4.9 万（赢1次）</text>
<rect x="114" y="250" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="250" width="13.8" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="263" font-size="12" fill="#1f2328">7.7%</text>
<text x="16" y="289" font-size="12" fill="#1f2328">7.4 万（赢2次）</text>
<rect x="114" y="276" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="276" width="41.5" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="289" font-size="12" fill="#1f2328">23.0%</text>
<text x="16" y="315" font-size="12" fill="#1f2328">11.1 万（赢3次）</text>
<rect x="114" y="302" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="302" width="62.2" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="315" font-size="12" fill="#1f2328">34.6%</text>
<text x="16" y="341" font-size="12" fill="#1f2328">16.6 万（赢4次）</text>
<rect x="114" y="328" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="328" width="46.7" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="341" font-size="12" fill="#1f2328">25.9%</text>
<text x="16" y="367" font-size="12" fill="#1f2328">24.9 万（赢5次）</text>
<rect x="114" y="354" width="180" height="18" fill="#e6e9ed" rx="3"/>
<rect x="114" y="354" width="14.0" height="18" fill="#2f6fdf" rx="3"/>
<text x="300" y="367" font-size="12" fill="#1f2328">7.8%</text>
<line x1="16" y1="390" x2="344" y2="390" stroke="#d8dee4"/>
<text x="16" y="410" font-size="12" fill="#1f2328">A 的期望更高，但 92.2% 的人会归零；</text>
<text x="16" y="428" font-size="12" fill="#1f2328">B 没有人归零，最差也剩 3.3 万。</text>
</svg>

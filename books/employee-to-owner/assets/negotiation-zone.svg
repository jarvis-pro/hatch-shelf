<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 386" width="360" height="386" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="385" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">可交易空间：两条底线有没有交集</text>
<text x="16" y="47" font-size="12" fill="#656d76">工位月租（元），原理示意；对方的底线是估计的</text>
<text x="16" y="80" font-size="13" font-weight="600" fill="#1f2328">A. 有交集：在中间找一个点</text>
<text x="16" y="106" font-size="12" fill="#1f2328">林岚</text>
<rect x="40.0" y="94" width="169.2" height="16" fill="#dbe7fb" rx="3"/>
<line x1="209.2" y1="91" x2="209.2" y2="113" stroke="#2f6fdf" stroke-width="2"/>
<text x="205.2" y="106" font-size="11" fill="#1f2328" text-anchor="end">最多付 1650</text>
<text x="16" y="132" font-size="12" fill="#1f2328">对方</text>
<rect x="112.5" y="120" width="217.5" height="16" fill="#e6e9ed" rx="3"/>
<line x1="112.5" y1="117" x2="112.5" y2="139" stroke="#656d76" stroke-width="2"/>
<text x="116.5" y="132" font-size="11" fill="#1f2328">最少收 1450</text>
<rect x="112.5" y="146" width="96.7" height="16" fill="#2f6fdf" rx="3"/>
<text x="160.8" y="158" font-size="11" fill="#ffffff" text-anchor="middle">可交易</text>
<text x="215.2" y="158" font-size="11" fill="#1f2328">1450–1650</text>
<line x1="40" y1="174" x2="330" y2="174" stroke="#656d76"/>
<line x1="40.0" y1="174" x2="40.0" y2="178" stroke="#656d76"/>
<text x="40.0" y="191" font-size="11" fill="#656d76" text-anchor="middle">1300</text>
<line x1="88.3" y1="174" x2="88.3" y2="178" stroke="#656d76"/>
<line x1="136.7" y1="174" x2="136.7" y2="178" stroke="#656d76"/>
<text x="136.7" y="191" font-size="11" fill="#656d76" text-anchor="middle">1500</text>
<line x1="185.0" y1="174" x2="185.0" y2="178" stroke="#656d76"/>
<line x1="233.3" y1="174" x2="233.3" y2="178" stroke="#656d76"/>
<text x="233.3" y="191" font-size="11" fill="#656d76" text-anchor="middle">1700</text>
<line x1="281.7" y1="174" x2="281.7" y2="178" stroke="#656d76"/>
<line x1="330.0" y1="174" x2="330.0" y2="178" stroke="#656d76"/>
<text x="330.0" y="191" font-size="11" fill="#656d76" text-anchor="middle">1900</text>
<text x="16" y="224" font-size="13" font-weight="600" fill="#1f2328">B. 没交集：走替代方案</text>
<text x="16" y="250" font-size="12" fill="#1f2328">林岚</text>
<rect x="40.0" y="238" width="169.2" height="16" fill="#dbe7fb" rx="3"/>
<line x1="209.2" y1="235" x2="209.2" y2="257" stroke="#2f6fdf" stroke-width="2"/>
<text x="205.2" y="250" font-size="11" fill="#1f2328" text-anchor="end">最多付 1650</text>
<text x="16" y="276" font-size="12" fill="#1f2328">对方</text>
<rect x="233.3" y="264" width="96.7" height="16" fill="#e6e9ed" rx="3"/>
<line x1="233.3" y1="261" x2="233.3" y2="283" stroke="#656d76" stroke-width="2"/>
<text x="237.3" y="276" font-size="11" fill="#1f2328">最少收 1700</text>
<line x1="209.2" y1="298" x2="233.3" y2="298" stroke="#656d76" stroke-dasharray="3 2"/>
<text x="239.3" y="302" font-size="11" fill="#1f2328">差 50，没有交集</text>
<line x1="40" y1="318" x2="330" y2="318" stroke="#656d76"/>
<line x1="40.0" y1="318" x2="40.0" y2="322" stroke="#656d76"/>
<text x="40.0" y="335" font-size="11" fill="#656d76" text-anchor="middle">1300</text>
<line x1="88.3" y1="318" x2="88.3" y2="322" stroke="#656d76"/>
<line x1="136.7" y1="318" x2="136.7" y2="322" stroke="#656d76"/>
<text x="136.7" y="335" font-size="11" fill="#656d76" text-anchor="middle">1500</text>
<line x1="185.0" y1="318" x2="185.0" y2="322" stroke="#656d76"/>
<line x1="233.3" y1="318" x2="233.3" y2="322" stroke="#656d76"/>
<text x="233.3" y="335" font-size="11" fill="#656d76" text-anchor="middle">1700</text>
<line x1="281.7" y1="318" x2="281.7" y2="322" stroke="#656d76"/>
<line x1="330.0" y1="318" x2="330.0" y2="322" stroke="#656d76"/>
<text x="330.0" y="335" font-size="11" fill="#656d76" text-anchor="middle">1900</text>
<text x="16" y="354" font-size="11" fill="#656d76">林岚的底线 1650 来自替代方案：隔壁月付 1650</text>
<text x="16" y="370" font-size="11" fill="#656d76">浅色条是各自能接受的价格范围</text>
</svg>

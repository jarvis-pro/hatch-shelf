<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdf"/></marker></defs>
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">两个切片共享同一个底层数组</text>
<text x="30" y="62" font-size="13" font-weight="600" fill="#1f2328">s := arr[1:4]</text>
<rect x="30" y="70" width="42" height="30" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="51" y="90" text-anchor="middle" font-size="12" fill="#1f2328">ptr</text>
<rect x="72" y="70" width="42" height="30" fill="#ffffff" stroke="#2f6fdf"/>
<text x="93" y="90" text-anchor="middle" font-size="12" fill="#1f2328">len 3</text>
<rect x="114" y="70" width="42" height="30" fill="#ffffff" stroke="#2f6fdf"/>
<text x="135" y="90" text-anchor="middle" font-size="12" fill="#1f2328">cap 5</text>
<text x="204" y="62" font-size="13" font-weight="600" fill="#1f2328">t := s[0:2]</text>
<rect x="204" y="70" width="42" height="30" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="225" y="90" text-anchor="middle" font-size="12" fill="#1f2328">ptr</text>
<rect x="246" y="70" width="42" height="30" fill="#ffffff" stroke="#2f6fdf"/>
<text x="267" y="90" text-anchor="middle" font-size="12" fill="#1f2328">len 2</text>
<rect x="288" y="70" width="42" height="30" fill="#ffffff" stroke="#2f6fdf"/>
<text x="309" y="90" text-anchor="middle" font-size="12" fill="#1f2328">cap 5</text>
<text x="330" y="170" text-anchor="end" font-size="12" fill="#656d76">底层数组 arr</text>
<rect x="30" y="180" width="50" height="36" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="55.0" y="203" text-anchor="middle" font-size="14" fill="#1f2328">0</text>
<text x="55.0" y="232" text-anchor="middle" font-size="11" fill="#656d76">[0]</text>
<rect x="80" y="180" width="50" height="36" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="105.0" y="203" text-anchor="middle" font-size="14" fill="#1f2328" font-weight="600">100</text>
<text x="105.0" y="232" text-anchor="middle" font-size="11" fill="#656d76">[1]</text>
<rect x="130" y="180" width="50" height="36" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="155.0" y="203" text-anchor="middle" font-size="14" fill="#1f2328">2</text>
<text x="155.0" y="232" text-anchor="middle" font-size="11" fill="#656d76">[2]</text>
<rect x="180" y="180" width="50" height="36" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="205.0" y="203" text-anchor="middle" font-size="14" fill="#1f2328">3</text>
<text x="205.0" y="232" text-anchor="middle" font-size="11" fill="#656d76">[3]</text>
<rect x="230" y="180" width="50" height="36" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="255.0" y="203" text-anchor="middle" font-size="14" fill="#1f2328">4</text>
<text x="255.0" y="232" text-anchor="middle" font-size="11" fill="#656d76">[4]</text>
<rect x="280" y="180" width="50" height="36" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="305.0" y="203" text-anchor="middle" font-size="14" fill="#1f2328">5</text>
<text x="305.0" y="232" text-anchor="middle" font-size="11" fill="#656d76">[5]</text>
<path d="M51,100 C51,135 97.0,140 97.0,178" fill="none" stroke="#2f6fdf" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M225,100 C225,140 113.0,135 113.0,178" fill="none" stroke="#2f6fdf" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M84,250 L84,256 L226,256 L226,250" fill="none" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="234" y="260" font-size="12" fill="#1f2328">s 看到的 3 个元素</text>
<path d="M84,274 L84,280 L176,280 L176,274" fill="none" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="184" y="284" font-size="12" fill="#1f2328">t 看到的 2 个元素</text>
<text x="180" y="314" text-anchor="middle" font-size="12" fill="#656d76">执行 t[0] = 100 后，s[0] 和 arr[1] 一起变成 100</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" width="360" height="324" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="323" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">四层东西，各用各的工具</text>
<rect x="16" y="52" width="262" height="70" rx="8" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>
<text x="28" y="76" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">应用版本</text>
<text x="28" y="96" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">镜像 tag、静态站版本</text>
<text x="28" y="114" font-size="12" fill="#2f6fdf" text-anchor="start" font-weight="600">工具：deploy.sh / Argo CD</text>
<text x="266" y="76" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">每天</text>
<rect x="16" y="132" width="262" height="70" rx="8" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>
<text x="28" y="156" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">系统配置</text>
<text x="28" y="176" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">包、用户、nginx、systemd</text>
<text x="28" y="194" font-size="12" fill="#2f6fdf" text-anchor="start" font-weight="600">工具：Ansible</text>
<text x="266" y="156" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">每几周</text>
<rect x="16" y="212" width="262" height="70" rx="8" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>
<text x="28" y="236" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">云资源</text>
<text x="28" y="256" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">机器、网络、安全组、DNS</text>
<text x="28" y="274" font-size="12" fill="#2f6fdf" text-anchor="start" font-weight="600">工具：OpenTofu</text>
<text x="266" y="236" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">每几个月</text>
<rect x="288" y="52" width="56" height="230" rx="8" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="316" y="130" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">密</text>
<text x="316" y="150" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">钥</text>
<text x="316" y="186" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600">SOPS</text>
<text x="316" y="204" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">贯穿</text>
<text x="316" y="220" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">三层</text>
<text x="180" y="306" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">越往上变得越频繁，越往下越难重来</text>
</svg>

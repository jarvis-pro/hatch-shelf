<text x="324" y="102" text-anchor="end" font-size="12" fill="#ffffff">3000 元以上</text>
<line x1="24" y1="120" x2="24" y2="214" stroke="#656d76" stroke-width="1.2"/>
<path d="M24 82 L19 92 L29 92 Z" fill="#656d76"/>
<line x1="24" y1="92" x2="24" y2="120" stroke="#656d76" stroke-width="1.2"/>
<text x="34" y="96" font-size="11" fill="#656d76">信任</text>
<text x="180" y="294" text-anchor="middle" font-size="11" fill="#656d76">每一级都要单独成立，不用残缺品逼人升级</text>
<text x="180" y="312" text-anchor="middle" font-size="11" fill="#656d76">价格为示例，按你的主题和受众定</text>

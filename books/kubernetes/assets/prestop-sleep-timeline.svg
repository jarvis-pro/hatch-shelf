<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f6fdf" stroke-width="2" stroke-opacity="0.35"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<rect x="0.5" y="0.5" width="359" height="469" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">preStop 睡 5 秒：等流量摘完再关停</text>
<text x="20" y="62" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">不睡：SIGTERM 早于摘除完成</text>
<text x="20" y="93" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">流量侧</text>
<text x="20" y="141" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">容器侧</text>
<rect x="76" y="76" width="138" height="26" rx="4" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="145.0" y="93" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">规则传播中</text>
<rect x="214" y="76" width="126" height="26" rx="4" fill="#ffffff" stroke="#d8dee4"/>
<text x="277.0" y="93" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">已摘除</text>
<rect x="76" y="124" width="74" height="26" rx="4" fill="#2f6fdf"/>
<text x="113.0" y="141" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">关停</text>
<text x="245.0" y="141" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">已退出</text>
<line x1="76" y1="104" x2="76" y2="122" stroke="#1f2328" stroke-width="1.5"/>
<text x="80" y="119" font-size="11" fill="#1f2328" text-anchor="start" font-weight="600">SIGTERM</text>
<rect x="78" y="72" width="136" height="82" rx="6" fill="url(#hatch)" stroke="#2f6fdf" stroke-width="2.5"/>
<line x1="76" y1="164" x2="340" y2="164" stroke="#656d76" marker-end="url(#ah)"/>
<text x="76" y="179" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">Pod 删除</text>
<text x="340" y="179" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">时间</text>
<text x="20" y="200" font-size="12" fill="#2f6fdf" text-anchor="start" font-weight="600">框内：仍有流量打到已关闭的进程 → 502</text>
<text x="20" y="236" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">睡 5 秒：摘除完成后才开始关停</text>
<text x="20" y="267" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">流量侧</text>
<text x="20" y="315" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">容器侧</text>
<rect x="76" y="250" width="138" height="26" rx="4" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="145.0" y="267" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">规则传播中</text>
<rect x="214" y="250" width="126" height="26" rx="4" fill="#ffffff" stroke="#d8dee4"/>
<text x="277.0" y="267" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">已摘除</text>
<rect x="76" y="298" width="160" height="26" rx="4" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="156.0" y="315" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="normal">preStop：sleep 5</text>
<rect x="236" y="298" width="60" height="26" rx="4" fill="#2f6fdf"/>
<text x="266.0" y="315" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">关停</text>
<text x="318.0" y="315" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">退出</text>
<line x1="236" y1="278" x2="236" y2="296" stroke="#1f2328" stroke-width="1.5"/>
<text x="240" y="293" font-size="11" fill="#1f2328" text-anchor="start" font-weight="600">SIGTERM</text>
<line x1="214" y1="246" x2="214" y2="328" stroke="#656d76" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="76" y1="338" x2="340" y2="338" stroke="#656d76" marker-end="url(#ah)"/>
<text x="76" y="353" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">Pod 删除</text>
<text x="340" y="353" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">时间</text>
<text x="20" y="374" font-size="12" fill="#2f6fdf" text-anchor="start" font-weight="600">摘除完成后才发 SIGTERM，窗口消失</text>
<line x1="20" y1="392" x2="340" y2="392" stroke="#d8dee4"/>
<text x="20" y="414" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">流量侧：EndpointSlice 更新后，各节点的</text>
<text x="20" y="432" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">kube-proxy 和 Ingress 陆续摘除这个 Pod</text>
<text x="20" y="454" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">容器侧：kubelet 先执行 preStop，再发 SIGTERM</text>
</svg>

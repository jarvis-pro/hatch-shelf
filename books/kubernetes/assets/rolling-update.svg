<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="359" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">滚动更新：2 副本，maxSurge 1</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">maxUnavailable 0，每行是一个时刻</text>
<text x="20" y="94" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">1</text>
<text x="38" y="94" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">初始</text>
<rect x="196" y="76" width="36" height="28" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="214" y="95" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">旧</text>
<rect x="238" y="76" width="36" height="28" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="256" y="95" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">旧</text>
<text x="340" y="95" font-size="13" fill="#656d76" text-anchor="end" font-weight="normal">2</text>
<line x1="20" y1="112" x2="340" y2="112" stroke="#d8dee4"/>
<text x="20" y="138" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">2</text>
<text x="38" y="138" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">起新 Pod</text>
<rect x="196" y="120" width="36" height="28" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="214" y="139" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">旧</text>
<rect x="238" y="120" width="36" height="28" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="256" y="139" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">旧</text>
<rect x="280" y="120" width="36" height="28" rx="6" fill="#dbe7fb" stroke="#2f6fdf" stroke-dasharray="3 2"/>
<text x="298" y="139" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="normal">新</text>
<text x="340" y="139" font-size="13" fill="#656d76" text-anchor="end" font-weight="normal">2</text>
<line x1="20" y1="156" x2="340" y2="156" stroke="#d8dee4"/>
<text x="20" y="182" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">3</text>
<text x="38" y="182" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">新的就绪，停一个旧的</text>
<rect x="196" y="164" width="36" height="28" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="214" y="183" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">旧</text>
<rect x="238" y="164" width="36" height="28" rx="6" fill="#2f6fdf"/>
<text x="256" y="183" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">新</text>
<text x="340" y="183" font-size="13" fill="#656d76" text-anchor="end" font-weight="normal">2</text>
<line x1="20" y1="200" x2="340" y2="200" stroke="#d8dee4"/>
<text x="20" y="226" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">4</text>
<text x="38" y="226" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">再起一个新 Pod</text>
<rect x="196" y="208" width="36" height="28" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="214" y="227" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">旧</text>
<rect x="238" y="208" width="36" height="28" rx="6" fill="#2f6fdf"/>
<text x="256" y="227" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">新</text>
<rect x="280" y="208" width="36" height="28" rx="6" fill="#dbe7fb" stroke="#2f6fdf" stroke-dasharray="3 2"/>
<text x="298" y="227" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="normal">新</text>
<text x="340" y="227" font-size="13" fill="#656d76" text-anchor="end" font-weight="normal">2</text>
<line x1="20" y1="244" x2="340" y2="244" stroke="#d8dee4"/>
<text x="20" y="270" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">5</text>
<text x="38" y="270" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">就绪，停最后一个旧的</text>
<rect x="196" y="252" width="36" height="28" rx="6" fill="#2f6fdf"/>
<text x="214" y="271" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">新</text>
<rect x="238" y="252" width="36" height="28" rx="6" fill="#2f6fdf"/>
<text x="256" y="271" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">新</text>
<text x="340" y="271" font-size="13" fill="#656d76" text-anchor="end" font-weight="normal">2</text>
<text x="340" y="64" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">就绪数</text>
<rect x="24" y="324" width="16" height="14" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="46" y="336" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">旧版本</text>
<rect x="114" y="324" width="16" height="14" rx="3" fill="#2f6fdf"/>
<text x="136" y="336" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">新版本已就绪</text>
<rect x="230" y="324" width="16" height="14" rx="3" fill="#dbe7fb" stroke="#2f6fdf" stroke-dasharray="3 2"/>
<text x="252" y="336" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">启动中</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">启动即崩溃的服务会被重启几次</text>
<text x="20" y="66" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">RestartSec=100ms（默认）</text>
<circle cx="30.0" cy="110" r="6" fill="#2f6fdf"/>
<text x="30.0" y="98" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">1</text>
<circle cx="60.0" cy="110" r="6" fill="#2f6fdf"/>
<text x="60.0" y="98" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">2</text>
<circle cx="90.0" cy="110" r="6" fill="#2f6fdf"/>
<text x="90.0" y="98" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">3</text>
<circle cx="120.0" cy="110" r="6" fill="#2f6fdf"/>
<text x="120.00000000000001" y="98" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">4</text>
<circle cx="150.0" cy="110" r="6" fill="#2f6fdf"/>
<text x="150.0" y="98" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">5</text>
<path d="M174.0 104 l12 12 M186.0 104 l-12 12" stroke="#1f2328" stroke-width="2"/>
<text x="194.0" y="114" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">第 6 次被拒绝 → failed</text>
<line x1="30" y1="124" x2="330" y2="124" stroke="#656d76"/>
<line x1="30.0" y1="124" x2="30.0" y2="128" stroke="#656d76"/>
<text x="30.0" y="141" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0s</text>
<line x1="105.0" y1="124" x2="105.0" y2="128" stroke="#656d76"/>
<text x="105.0" y="141" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.25s</text>
<line x1="180.0" y1="124" x2="180.0" y2="128" stroke="#656d76"/>
<text x="180.0" y="141" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.5s</text>
<line x1="255.0" y1="124" x2="255.0" y2="128" stroke="#656d76"/>
<text x="255.0" y="141" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0.75s</text>
<line x1="330.0" y1="124" x2="330.0" y2="128" stroke="#656d76"/>
<text x="330.0" y="141" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">1s</text>
<text x="180" y="160" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">0.5 秒内用完 5 次额度，之后不再自动恢复</text>
<text x="20" y="196" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">RestartSec=5s</text>
<rect x="30" y="226" width="100.0" height="28" rx="4" fill="#dbe7fb"/>
<circle cx="30.0" cy="240" r="6" fill="#2f6fdf"/>
<circle cx="80.0" cy="240" r="6" fill="#2f6fdf"/>
<circle cx="130.0" cy="240" r="6" fill="#2f6fdf"/>
<circle cx="180.0" cy="240" r="6" fill="#2f6fdf"/>
<circle cx="230.0" cy="240" r="6" fill="#2f6fdf"/>
<circle cx="280.0" cy="240" r="6" fill="#2f6fdf"/>
<circle cx="330.0" cy="240" r="6" fill="#2f6fdf"/>
<line x1="30" y1="254" x2="330" y2="254" stroke="#656d76"/>
<line x1="30.0" y1="254" x2="30.0" y2="258" stroke="#656d76"/>
<text x="30.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0s</text>
<line x1="80.0" y1="254" x2="80.0" y2="258" stroke="#656d76"/>
<text x="80.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">5s</text>
<line x1="130.0" y1="254" x2="130.0" y2="258" stroke="#656d76"/>
<text x="130.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">10s</text>
<line x1="180.0" y1="254" x2="180.0" y2="258" stroke="#656d76"/>
<text x="180.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">15s</text>
<line x1="230.0" y1="254" x2="230.0" y2="258" stroke="#656d76"/>
<text x="230.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">20s</text>
<line x1="280.0" y1="254" x2="280.0" y2="258" stroke="#656d76"/>
<text x="280.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">25s</text>
<line x1="330.0" y1="254" x2="330.0" y2="258" stroke="#656d76"/>
<text x="330.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">30s</text>
<text x="180" y="290" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">任意 10 秒窗口（浅蓝）最多 3 次，永不触发限制</text>
<text x="180" y="316" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">默认限制：10 秒内最多启动 5 次（StartLimitBurst=5）</text>
</svg>

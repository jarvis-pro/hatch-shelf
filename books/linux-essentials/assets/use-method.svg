<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" width="360" height="364" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="363" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">USE 方法速查</text>
<rect x="80" y="48" width="264" height="30" rx="4" fill="#dbe7fb"/>
<text x="124.0" y="68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">使用率</text>
<text x="212.0" y="68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">饱和度</text>
<text x="300.0" y="68" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">错误</text>
<text x="20" y="106.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">CPU</text>
<text x="124.0" y="98" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">top</text>
<text x="124.0" y="115" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">us + sy</text>
<text x="212.0" y="98" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">uptime</text>
<text x="212.0" y="115" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">负载 > nproc</text>
<text x="300.0" y="98" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">dmesg</text>
<text x="300.0" y="115" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">硬件报错</text>
<line x1="16" y1="126" x2="344" y2="126" stroke="#d8dee4"/>
<text x="20" y="154.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">内存</text>
<text x="124.0" y="146" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">free -h</text>
<text x="124.0" y="163" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">看 available</text>
<text x="212.0" y="146" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">vmstat 1</text>
<text x="212.0" y="163" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">si / so 非 0</text>
<text x="300.0" y="146" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">journalctl -k</text>
<text x="300.0" y="163" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">OOM 记录</text>
<line x1="16" y1="174" x2="344" y2="174" stroke="#d8dee4"/>
<text x="20" y="202.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">磁盘 I/O</text>
<text x="124.0" y="194" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">iostat -xz 1</text>
<text x="124.0" y="211" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">%util</text>
<text x="212.0" y="194" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">iostat -xz 1</text>
<text x="212.0" y="211" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">await 变大</text>
<text x="300.0" y="194" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">dmesg</text>
<text x="300.0" y="211" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">I/O error</text>
<line x1="16" y1="222" x2="344" y2="222" stroke="#d8dee4"/>
<text x="20" y="250.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">磁盘空间</text>
<text x="124.0" y="242" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">df -h</text>
<text x="124.0" y="259" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">Use%</text>
<text x="212.0" y="242" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">df -i</text>
<text x="212.0" y="259" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">inode 用量</text>
<text x="300.0" y="242" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">应用日志</text>
<text x="300.0" y="259" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">No space</text>
<line x1="16" y1="270" x2="344" y2="270" stroke="#d8dee4"/>
<text x="20" y="298.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">网络</text>
<text x="124.0" y="290" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">sar -n DEV 1</text>
<text x="124.0" y="307" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">带宽</text>
<text x="212.0" y="290" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">ss -s</text>
<text x="212.0" y="307" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">连接数、积压</text>
<text x="300.0" y="290" font-size="11" fill="#2f6fdf" text-anchor="middle" font-weight="normal">ip -s link</text>
<text x="300.0" y="307" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">errors、drop</text>
<line x1="16" y1="318" x2="344" y2="318" stroke="#d8dee4"/>
<line x1="80" y1="48" x2="80" y2="318" stroke="#d8dee4"/>
<line x1="168" y1="48" x2="168" y2="318" stroke="#d8dee4"/>
<line x1="256" y1="48" x2="256" y2="318" stroke="#d8dee4"/>
<line x1="344" y1="48" x2="344" y2="318" stroke="#d8dee4"/>
<text x="180" y="346" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">蓝色是命令，灰色是要看的指标</text>
</svg>

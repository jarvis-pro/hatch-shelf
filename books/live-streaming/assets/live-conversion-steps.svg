<svg xmlns="http://www.w3.org/2000/svg" width="360" height="352" viewBox="0 0 360 352" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="351" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="20" y="30" font-size="15" font-weight="600" fill="#1f2328">示例场次：带货直播各环节转化率</text>
<text x="20" y="48" font-size="12" fill="#656d76">按第 8 章示例数字计算，条长为 0–100%</text>
<text x="20" y="82" font-size="13" fill="#1f2328">曝光 → 进入直播间</text>
<text x="340" y="82" font-size="12" fill="#656d76" text-anchor="end">20000 → 1600</text>
<rect x="20" y="90" width="240" height="20" rx="4" fill="#e6e9ed"/>
<rect x="20" y="90" width="19.2" height="20" rx="4" fill="#2f6fdf"/>
<text x="270" y="105" font-size="13" font-weight="600" fill="#1f2328">8.0%</text>
<text x="20" y="140" font-size="13" fill="#1f2328">进入 → 看到商品</text>
<text x="340" y="140" font-size="12" fill="#656d76" text-anchor="end">1600 → 1120</text>
<rect x="20" y="148" width="240" height="20" rx="4" fill="#e6e9ed"/>
<rect x="20" y="148" width="168.0" height="20" rx="4" fill="#2f6fdf"/>
<text x="270" y="163" font-size="13" font-weight="600" fill="#1f2328">70.0%</text>
<text x="20" y="198" font-size="13" fill="#1f2328">看到商品 → 点击</text>
<text x="340" y="198" font-size="12" fill="#656d76" text-anchor="end">1120 → 168</text>
<rect x="20" y="206" width="240" height="20" rx="4" fill="#e6e9ed"/>
<rect x="20" y="206" width="36.0" height="20" rx="4" fill="#2f6fdf"/>
<text x="270" y="221" font-size="13" font-weight="600" fill="#1f2328">15.0%</text>
<text x="20" y="256" font-size="13" fill="#1f2328">点击 → 成交</text>
<text x="340" y="256" font-size="12" fill="#656d76" text-anchor="end">168 → 25</text>
<rect x="20" y="264" width="240" height="20" rx="4" fill="#e6e9ed"/>
<rect x="20" y="264" width="35.7" height="20" rx="4" fill="#2f6fdf"/>
<text x="270" y="279" font-size="13" font-weight="600" fill="#1f2328">14.9%</text>
<text x="20" y="314" font-size="12" fill="#656d76">整体：曝光到成交 25 / 20000 = 0.125%</text>
<text x="20" y="334" font-size="12" fill="#656d76">进入到成交 25 / 1600 ≈ 1.6%</text>
</svg>
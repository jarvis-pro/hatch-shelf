<svg xmlns="http://www.w3.org/2000/svg" width="360" height="412" viewBox="0 0 360 412" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="411" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="20" y="30" font-size="15" font-weight="600" fill="#1f2328">一场 60 分钟带货直播的排品节奏</text>
<text x="20" y="48" font-size="12" fill="#656d76">第 6 章示例场次，横轴为开播后的分钟数</text>
<line x1="100.0" y1="64" x2="100.0" y2="322" stroke="#d8dee4"/>
<text x="100.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">0</text>
<line x1="140.0" y1="64" x2="140.0" y2="322" stroke="#d8dee4"/>
<text x="140.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">10</text>
<line x1="180.0" y1="64" x2="180.0" y2="322" stroke="#d8dee4"/>
<text x="180.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">20</text>
<line x1="220.0" y1="64" x2="220.0" y2="322" stroke="#d8dee4"/>
<text x="220.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">30</text>
<line x1="260.0" y1="64" x2="260.0" y2="322" stroke="#d8dee4"/>
<text x="260.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">40</text>
<line x1="300.0" y1="64" x2="300.0" y2="322" stroke="#d8dee4"/>
<text x="300.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">50</text>
<line x1="340.0" y1="64" x2="340.0" y2="322" stroke="#d8dee4"/>
<text x="340.0" y="338" font-size="11" fill="#656d76" text-anchor="middle">60</text>
<text x="20" y="86" font-size="12" fill="#1f2328">开场</text>
<rect x="100.0" y="73" width="12.0" height="18" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="20" y="114" font-size="12" fill="#1f2328">理线套装</text>
<rect x="112.0" y="101" width="28.0" height="18" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="20" y="142" font-size="12" fill="#1f2328">屏幕挂灯</text>
<rect x="140.0" y="129" width="40.0" height="18" rx="3" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="20" y="170" font-size="12" fill="#1f2328">桌垫</text>
<rect x="180.0" y="157" width="20.0" height="18" rx="3" fill="#ffffff" stroke="#2f6fdf"/>
<text x="20" y="198" font-size="12" fill="#1f2328">显示器支架</text>
<rect x="200.0" y="185" width="40.0" height="18" rx="3" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="20" y="226" font-size="12" fill="#1f2328">笔记本支架</text>
<rect x="240.0" y="213" width="20.0" height="18" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="20" y="254" font-size="12" fill="#1f2328">机械键盘</text>
<rect x="260.0" y="241" width="40.0" height="18" rx="3" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="20" y="282" font-size="12" fill="#1f2328">返场</text>
<rect x="300.0" y="269" width="20.0" height="18" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="20" y="310" font-size="12" fill="#1f2328">下播</text>
<rect x="320.0" y="297" width="20.0" height="18" rx="3" fill="#e6e9ed" stroke="#d8dee4"/>
<rect x="20" y="352" width="14" height="12" rx="2" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="40" y="362" font-size="11" fill="#656d76">利润款 / 主推</text>
<rect x="120" y="352" width="14" height="12" rx="2" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="140" y="362" font-size="11" fill="#656d76">引流 / 搭配</text>
<rect x="220" y="352" width="14" height="12" rx="2" fill="#ffffff" stroke="#2f6fdf"/>
<text x="240" y="362" font-size="11" fill="#656d76">福利款</text>
<rect x="20" y="374" width="14" height="12" rx="2" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="40" y="384" font-size="11" fill="#656d76">非讲品环节</text>
</svg>
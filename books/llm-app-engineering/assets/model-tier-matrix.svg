<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="379" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">按任务难度和调用量选模型档位</text>
<rect x="59" y="59" width="134" height="134" rx="8" fill="#2f6fdf"/>
<text x="126.0" y="108" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">大模型</text>
<text x="126.0" y="128" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">高 effort</text>
<text x="126.0" y="156" font-size="11" fill="#dbe7fb" text-anchor="middle" font-weight="normal">难而少：架构评审、</text>
<text x="126.0" y="172" font-size="11" fill="#dbe7fb" text-anchor="middle" font-weight="normal">复杂分析</text>
<rect x="199" y="59" width="134" height="134" rx="8" fill="#dbe7fb"/>
<text x="266.0" y="108" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">大模型低 effort</text>
<text x="266.0" y="128" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">或中档模型</text>
<text x="266.0" y="156" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">难且多：先实测再定，</text>
<text x="266.0" y="172" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">可分流</text>
<rect x="59" y="199" width="134" height="134" rx="8" fill="#e6e9ed"/>
<text x="126.0" y="258" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">中档模型</text>
<text x="126.0" y="296" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">易而少：怎么选都行，</text>
<text x="126.0" y="312" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">省心优先</text>
<rect x="199" y="199" width="134" height="134" rx="8" fill="#dbe7fb"/>
<text x="266.0" y="258" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">小模型</text>
<text x="266.0" y="296" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">易而多：分类、提取、</text>
<text x="266.0" y="312" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">打标签</text>
<text x="196" y="366" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">调用量  少 → 多</text>
<text x="30" y="196" font-size="12" fill="#656d76" text-anchor="middle" transform="rotate(-90 30 196)">难度  易 → 难</text>
<text x="126.0" y="48" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">少</text>
<text x="266.0" y="48" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">多</text>
</svg>

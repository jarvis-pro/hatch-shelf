<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="329" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">指数退避 + 全抖动的等待时间</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">基数 1 秒、每次翻倍、上限 30 秒</text>
<line x1="48" y1="255.0" x2="340" y2="255.0" stroke="#d8dee4"/>
<text x="40" y="259.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">0s</text>
<line x1="48" y1="208.8" x2="340" y2="208.8" stroke="#d8dee4"/>
<text x="40" y="212.75" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">8s</text>
<line x1="48" y1="162.5" x2="340" y2="162.5" stroke="#d8dee4"/>
<text x="40" y="166.5" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">16s</text>
<line x1="48" y1="116.2" x2="340" y2="116.2" stroke="#d8dee4"/>
<text x="40" y="120.25" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">24s</text>
<line x1="48" y1="70.0" x2="340" y2="70.0" stroke="#d8dee4"/>
<text x="40" y="74.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">32s</text>
<rect x="57.3" y="249.2" width="30" height="5.8" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="72.33333333333333" y="243.21875" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">1s</text>
<text x="72.33333333333333" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">第1次</text>
<rect x="106.0" y="243.4" width="30" height="11.6" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="121.0" y="237.4375" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">2s</text>
<text x="121.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">第2次</text>
<rect x="154.7" y="231.9" width="30" height="23.1" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="169.66666666666666" y="225.875" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">4s</text>
<text x="169.66666666666666" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">第3次</text>
<rect x="203.3" y="208.8" width="30" height="46.2" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="218.33333333333331" y="202.75" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">8s</text>
<text x="218.33333333333331" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">第4次</text>
<rect x="252.0" y="162.5" width="30" height="92.5" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="267.0" y="156.5" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">16s</text>
<text x="267.0" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">第5次</text>
<rect x="300.7" y="81.6" width="30" height="173.4" rx="3" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="315.66666666666663" y="75.5625" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="600">30s</text>
<text x="315.66666666666663" y="271" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">第6次</text>
<text x="194.0" y="289" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">第几次重试</text>
<rect x="40" y="303" width="14" height="12" rx="2" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="60" y="314" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">实际等待在 0 到上限之间随机取值</text>
</svg>

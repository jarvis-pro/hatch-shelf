<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" width="360" height="312" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="311" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">评判模型与人工的判断对比</text>
<text x="180" y="47" text-anchor="middle" font-size="12" fill="#656d76">100 条样例，示意数据</text>
<text x="230" y="72" text-anchor="middle" font-size="12" fill="#656d76">人工判断</text>
<text x="175.0" y="88" text-anchor="middle" font-size="12" fill="#1f2328">通过</text>
<text x="285.0" y="88" text-anchor="middle" font-size="12" fill="#1f2328">不通过</text>
<text x="34" y="168" text-anchor="middle" font-size="12" fill="#656d76" transform="rotate(-90 34 168)">评判模型</text>
<text x="110" y="136.0" text-anchor="end" font-size="12" fill="#1f2328">通过</text>
<text x="110" y="208.0" text-anchor="end" font-size="12" fill="#1f2328">不通过</text>
<rect x="122" y="98" width="106" height="68" rx="6" fill="#dbe7fb"/>
<text x="175.0" y="134.0" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2328">62</text>
<text x="175.0" y="154.0" text-anchor="middle" font-size="12" fill="#656d76">一致</text>
<rect x="232" y="98" width="106" height="68" rx="6" fill="#2f6fdf"/>
<text x="285.0" y="134.0" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">10</text>
<text x="285.0" y="154.0" text-anchor="middle" font-size="12" fill="#ffffff">假通过</text>
<rect x="122" y="170" width="106" height="68" rx="6" fill="#e6e9ed"/>
<text x="175.0" y="206.0" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2328">6</text>
<text x="175.0" y="226.0" text-anchor="middle" font-size="12" fill="#656d76">假不通过</text>
<rect x="232" y="170" width="106" height="68" rx="6" fill="#dbe7fb"/>
<text x="285.0" y="206.0" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2328">22</text>
<text x="285.0" y="226.0" text-anchor="middle" font-size="12" fill="#656d76">一致</text>
<text x="180" y="270" text-anchor="middle" font-size="13" fill="#1f2328">一致率 84%　Cohen’s κ ≈ 0.62</text>
<text x="180" y="292" text-anchor="middle" font-size="12" fill="#656d76">深色格是最危险的：评判放过了人认为不行的输出</text></svg>

<text x="196.0" y="92.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >a·b = 3×2 + 1×4 = 10</text>
<text x="196.0" y="112.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >|a| = √10，|b| = √20</text>
<text x="196.0" y="132.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" >cos θ = 10 / √200 ≈ 0.707</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="319" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600" >矩阵 M 把单位正方形变成平行四边形</text>
<line x1="60.0" y1="248.8" x2="60.0" y2="76.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="132.0" y1="248.8" x2="132.0" y2="76.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="204.0" y1="248.8" x2="204.0" y2="76.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="276.0" y1="248.8" x2="276.0" y2="76.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="31.2" y1="220.0" x2="319.2" y2="220.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="31.2" y1="148.0" x2="319.2" y2="148.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="31.2" y1="76.0" x2="319.2" y2="76.0" stroke="#d8dee4" stroke-width="1"/>
<line x1="31.2" y1="220.0" x2="319.2" y2="220.0" stroke="#656d76" stroke-width="1"/>
<line x1="60.0" y1="248.8" x2="60.0" y2="76.0" stroke="#656d76" stroke-width="1"/>
<text x="132.0" y="236.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >1</text>
<text x="204.0" y="236.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >2</text>
<text x="276.0" y="236.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >3</text>
<text x="52.0" y="152.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal" >1</text>
<text x="52.0" y="80.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal" >2</text>
<path d="M60.0,220.0 L204.0,220.0 L276.0,148.0 L132.0,148.0 Z" stroke="#2f6fdf" stroke-width="1.5" fill="#dbe7fb" stroke-linejoin="round"/>
<path d="M60.0,220.0 L132.0,220.0 L132.0,148.0 L60.0,148.0 Z" stroke="#656d76" stroke-width="1.5" fill="#e6e9ed" stroke-dasharray="4 3" stroke-linejoin="round"/>
<line x1="60.0" y1="220.0" x2="123.0" y2="220.0" stroke="#656d76" stroke-width="2.5"/>
<polygon points="132.0,220.0 123.0,215.5 123.0,224.5" fill="#656d76"/>
<line x1="60.0" y1="220.0" x2="60.0" y2="157.0" stroke="#656d76" stroke-width="2.5"/>
<polygon points="60.0,148.0 55.5,157.0 64.5,157.0" fill="#656d76"/>
<line x1="60.0" y1="220.0" x2="195.0" y2="220.0" stroke="#2f6fdf" stroke-width="2.5"/>
<polygon points="204.0,220.0 195.0,215.5 195.0,224.5" fill="#2f6fdf"/>
<line x1="60.0" y1="220.0" x2="125.6" y2="154.4" stroke="#2f6fdf" stroke-width="2.5"/>
<polygon points="132.0,148.0 122.5,151.2 128.8,157.5" fill="#2f6fdf"/>
<text x="96.0" y="236.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >e₁</text>
<text x="52.0" y="188.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal" >e₂</text>
<text x="175.2" y="211.0" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600" >Me₁ = (2, 0)</text>
<text x="130.0" y="138.0" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600" >Me₂ = (1, 1)</text>
<circle cx="276.0" cy="148.0" r="3.5" fill="#2f6fdf" stroke="none" stroke-width="1"/>
<text x="272.0" y="138.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" >(1,1) → (3,1)</text>
<text x="180.0" y="262.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" >M 的第 1 列 (2, 0) 是 e₁ 的去处，第 2 列 (1, 1) 是 e₂ 的去处</text>
<text x="180.0" y="282.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal" >面积从 1 变成 2，正好等于 det M = 2×1 − 1×0</text>
<rect x="78" y="294" width="14" height="10" fill="#e6e9ed" stroke="#656d76"/>
<text x="98.0" y="303.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >变换前</text>
<rect x="200" y="294" width="14" height="10" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="220.0" y="303.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal" >变换后</text>
</svg>

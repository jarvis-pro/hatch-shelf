<rect x="198.7" y="254" width="35.3" height="16" fill="#dbe7fb"/>
<text x="238.0" y="266" text-anchor="start" font-size="11" fill="#1f2328">8–12</text>
<text x="122" y="289" text-anchor="end" font-size="11" fill="#1f2328">D3 上线与首笔收入</text>
<rect x="128" y="278" width="35.3" height="16" fill="#2f6fdf"/>
<rect x="163.3" y="278" width="70.7" height="16" fill="#dbe7fb"/>
<text x="238.0" y="290" text-anchor="start" font-size="11" fill="#1f2328">4–12</text>

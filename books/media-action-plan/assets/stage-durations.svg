<line x1="234.0" y1="328" x2="234.0" y2="332" stroke="#656d76"/>
<text x="234.0" y="344" text-anchor="middle" font-size="11" fill="#656d76">12</text>
<line x1="287.0" y1="328" x2="287.0" y2="332" stroke="#656d76"/>
<text x="287.0" y="344" text-anchor="middle" font-size="11" fill="#656d76">18</text>
<line x1="340.0" y1="328" x2="340.0" y2="332" stroke="#656d76"/>
<text x="340.0" y="344" text-anchor="middle" font-size="11" fill="#656d76">24</text>
<text x="180" y="360" text-anchor="middle" font-size="11" fill="#656d76">A5 与 D5 是决策阶段，不按周期计；数字均为建议值</text>

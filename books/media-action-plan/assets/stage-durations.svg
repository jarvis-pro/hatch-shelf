<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" width="360" height="376" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="375" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">各阶段建议周期（周）</text>

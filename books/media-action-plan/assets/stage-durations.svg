<rect x="128" y="132" width="70.7" height="16" fill="#2f6fdf"/>
<rect x="198.7" y="132" width="70.7" height="16" fill="#dbe7fb"/>
<text x="273.3" y="144" text-anchor="start" font-size="11" fill="#1f2328">8–16</text>
<text x="122" y="167" text-anchor="end" font-size="11" fill="#1f2328">A3 第一笔收入</text>
<rect x="128" y="156" width="70.7" height="16" fill="#2f6fdf"/>
<rect x="198.7" y="156" width="70.7" height="16" fill="#dbe7fb"/>
<text x="273.3" y="168" text-anchor="start" font-size="11" fill="#1f2328">8–16</text>
<text x="122" y="191" text-anchor="end" font-size="11" fill="#1f2328">A4 稳定月入</text>

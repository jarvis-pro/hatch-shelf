<svg xmlns="http://www.w3.org/2000/svg" width="360" height="336" viewBox="0 0 360 336" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="335" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="16" y="28" font-size="15" font-weight="600" fill="#1f2328">30 个案例的主要变现方式</text>
<text x="16" y="46" font-size="12" fill="#656d76">按本书各案例卡片的「怎么变现」一栏统计</text>
<text x="128" y="76" font-size="12" fill="#1f2328" text-anchor="end">未公开或未变现</text>
<rect x="136" y="63" width="170" height="18" rx="3" fill="#e6e9ed"/>
<text x="312" y="76" font-size="12" fill="#656d76">10</text>
<text x="128" y="104" font-size="12" fill="#1f2328" text-anchor="end">带货佣金与自营</text>
<rect x="136" y="91" width="136" height="18" rx="3" fill="#2f6fdf"/>
<text x="278" y="104" font-size="12" fill="#656d76">8</text>
<text x="128" y="132" font-size="12" fill="#1f2328" text-anchor="end">广告商单</text>
<rect x="136" y="119" width="51" height="18" rx="3" fill="#2f6fdf"/>
<text x="193" y="132" font-size="12" fill="#656d76">3</text>
<text x="128" y="160" font-size="12" fill="#1f2328" text-anchor="end">短剧充值或分账</text>
<rect x="136" y="147" width="51" height="18" rx="3" fill="#2f6fdf"/>
<text x="193" y="160" font-size="12" fill="#656d76">3</text>
<text x="128" y="188" font-size="12" fill="#1f2328" text-anchor="end">知识付费与产品</text>
<rect x="136" y="175" width="34" height="18" rx="3" fill="#2f6fdf"/>
<text x="176" y="188" font-size="12" fill="#656d76">2</text>
<text x="128" y="216" font-size="12" fill="#1f2328" text-anchor="end">不适用（处置批次）</text>
<rect x="136" y="203" width="34" height="18" rx="3" fill="#e6e9ed"/>
<text x="176" y="216" font-size="12" fill="#656d76">2</text>
<text x="128" y="244" font-size="12" fill="#1f2328" text-anchor="end">自有品牌</text>
<rect x="136" y="231" width="17" height="18" rx="3" fill="#2f6fdf"/>
<text x="159" y="244" font-size="12" fill="#656d76">1</text>
<text x="128" y="272" font-size="12" fill="#1f2328" text-anchor="end">文旅机构雇佣</text>
<rect x="136" y="259" width="17" height="18" rx="3" fill="#2f6fdf"/>
<text x="159" y="272" font-size="12" fill="#656d76">1</text>
<line x1="136" y1="60" x2="136" y2="286" stroke="#d8dee4"/>
<text x="16" y="300" font-size="11" fill="#656d76">灰色：没有公开变现方式，或是处置批次、平台约谈</text>
<text x="16" y="318" font-size="11" fill="#656d76">每个案例只计一种主要方式；合计 30</text>
</svg>
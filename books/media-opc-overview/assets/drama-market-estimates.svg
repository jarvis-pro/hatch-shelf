<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="359" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">微短剧与漫剧规模：几种公开估计</text>
<text x="180" y="47" font-size="12" fill="#656d76" text-anchor="middle">单位：亿元；口径不同，不可直接相加</text>
<!-- scale: 0..1000 -> 0..200px, x0=140 -->
<line x1="140" y1="62" x2="140" y2="268" stroke="#d8dee4"/>
<line x1="240" y1="62" x2="240" y2="268" stroke="#d8dee4" stroke-dasharray="3 3"/>
<line x1="340" y1="62" x2="340" y2="268" stroke="#d8dee4" stroke-dasharray="3 3"/>
<text x="140" y="284" font-size="11" fill="#656d76" text-anchor="middle">0</text>
<text x="240" y="284" font-size="11" fill="#656d76" text-anchor="middle">500</text>
<text x="334" y="284" font-size="11" fill="#656d76" text-anchor="middle">1000</text>

<text x="132" y="82" font-size="12" fill="#1f2328" text-anchor="end">2025 微短剧</text>
<text x="132" y="97" font-size="11" fill="#656d76" text-anchor="end">阶段性报告</text>
<rect x="140" y="72" width="126.8" height="26" fill="#dbe7fb"/>
<text x="272" y="90" font-size="12" fill="#1f2328">634</text>

<text x="132" y="122" font-size="12" fill="#1f2328" text-anchor="end">2025 微短剧</text>
<text x="132" y="137" font-size="11" fill="#656d76" text-anchor="end">艾媒咨询</text>
<rect x="140" y="112" width="135.6" height="26" fill="#dbe7fb"/>
<text x="281" y="130" font-size="12" fill="#1f2328">677.9</text>

<text x="132" y="162" font-size="12" fill="#1f2328" text-anchor="end">2025 含漫剧</text>
<text x="132" y="177" font-size="11" fill="#656d76" text-anchor="end">网络视听报告</text>
<rect x="140" y="152" width="200" height="26" fill="#2f6fdf"/>
<text x="334" y="170" font-size="12" fill="#ffffff" text-anchor="end">超 1000</text>

<text x="132" y="202" font-size="12" fill="#1f2328" text-anchor="end">2025 动画微短剧</text>
<text x="132" y="217" font-size="11" fill="#656d76" text-anchor="end">艾媒咨询</text>
<rect x="140" y="192" width="37.96" height="26" fill="#e6e9ed"/>
<text x="184" y="210" font-size="12" fill="#1f2328">189.8</text>

<text x="132" y="242" font-size="12" fill="#1f2328" text-anchor="end">2026E AI 剧漫剧</text>
<text x="132" y="257" font-size="11" fill="#656d76" text-anchor="end">DataEye 预估</text>
<rect x="140" y="232" width="80" height="26" fill="#e6e9ed" stroke="#2f6fdf" stroke-dasharray="4 3"/>
<text x="226" y="250" font-size="12" fill="#1f2328">约 400</text>

<text x="20" y="310" font-size="11" fill="#656d76">来源：《2025 年微短剧阶段性发展报告》（文艺报引用）；</text>
<text x="20" y="326" font-size="11" fill="#656d76">艾媒咨询；《中国网络视听发展研究报告（2026）》；</text>
<text x="20" y="342" font-size="11" fill="#656d76">DataEye 研究院。虚线框为预估值，均为 2026 年公开报道。</text>
</svg>

<text x="320" y="274" font-size="11" fill="#656d76" text-anchor="middle">15</text>

<text x="102" y="86" font-size="12" fill="#1f2328" text-anchor="end">微信（合并）</text>
<rect x="110" y="70" width="201.5" height="24" fill="#e6e9ed"/>
<text x="305" y="87" font-size="12" fill="#1f2328" text-anchor="end">14.39</text>


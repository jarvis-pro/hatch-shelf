<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="339" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">付费短剧：每 100 元充值流向哪里</text>
<text x="180.0" y="50.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">示意测算，按第 6 章假设：投流 ROI 1.15</text>
<rect x="30.0" y="70" width="261.0" height="32" fill="#2f6fdf" stroke="#ffffff"/>
<rect x="291.0" y="70" width="21.0" height="32" fill="#656d76" stroke="#ffffff"/>
<rect x="312.0" y="70" width="7.8" height="32" fill="#d8dee4" stroke="#ffffff"/>
<rect x="319.8" y="70" width="6.6" height="32" fill="#dbe7fb" stroke="#ffffff"/>
<rect x="326.4" y="70" width="3.9" height="32" fill="#e6e9ed" stroke="#ffffff"/>
<text x="30.0" y="120.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">0</text>
<text x="330.0" y="120.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">100 元</text>
<rect x="40" y="139" width="14" height="14" fill="#2f6fdf"/>
<text x="62.0" y="150.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">投流消耗</text>
<text x="320.0" y="150.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">87.0 元</text>
<rect x="40" y="169" width="14" height="14" fill="#656d76"/>
<text x="62.0" y="180.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">支付通道 / 技术服务费</text>
<text x="320.0" y="180.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">7.0 元</text>
<rect x="40" y="199" width="14" height="14" fill="#d8dee4" stroke="#d8dee4"/>
<text x="62.0" y="210.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">分销 / 代投服务费</text>
<text x="320.0" y="210.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">2.6 元</text>
<rect x="40" y="229" width="14" height="14" fill="#dbe7fb" stroke="#d8dee4"/>
<text x="62.0" y="240.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">制作成本摊销</text>
<text x="320.0" y="240.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">2.2 元</text>
<rect x="40" y="259" width="14" height="14" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="62.0" y="270.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">版权方剩余</text>
<text x="320.0" y="270.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">1.3 元</text>
<text x="180.0" y="312.0" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600">结论：赚不赚钱几乎只取决于投流 ROI</text>
<text x="180.0" y="328.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">数字为假设推算并四舍五入，非行业统计</text>
</svg>

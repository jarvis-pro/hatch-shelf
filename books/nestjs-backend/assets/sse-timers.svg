<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">推送长连接上的几个计时器</text>
<text x="180" y="50" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">横轴：距上一次有字节经过的时间（秒）</text>
<line x1="120.0" y1="66" x2="120.0" y2="236" stroke="#d8dee4" stroke-width="1"/>
<text x="120.0" y="252" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0</text>
<line x1="170.76923076923077" y1="66" x2="170.76923076923077" y2="236" stroke="#d8dee4" stroke-width="1"/>
<text x="170.76923076923077" y="252" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">30</text>
<line x1="221.53846153846155" y1="66" x2="221.53846153846155" y2="236" stroke="#d8dee4" stroke-width="1"/>
<text x="221.53846153846155" y="252" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">60</text>
<line x1="272.3076923076923" y1="66" x2="272.3076923076923" y2="236" stroke="#d8dee4" stroke-width="1"/>
<text x="272.3076923076923" y="252" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">90</text>
<line x1="323.0769230769231" y1="66" x2="323.0769230769231" y2="236" stroke="#d8dee4" stroke-width="1"/>
<text x="323.0769230769231" y="252" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">120</text>
<text x="20" y="93" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">服务端心跳</text>
<circle cx="162.30769230769232" cy="88" r="5" fill="#2f6fdf"/>
<circle cx="204.6153846153846" cy="88" r="5" fill="#2f6fdf"/>
<circle cx="246.9230769230769" cy="88" r="5" fill="#2f6fdf"/>
<circle cx="289.2307692307692" cy="88" r="5" fill="#2f6fdf"/>
<circle cx="331.53846153846155" cy="88" r="5" fill="#2f6fdf"/>
<text x="124" y="110" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">每 25 秒一行注释</text>
<text x="20" y="133" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">nginx 默认</text>
<rect x="120" y="120" width="101.53846153846155" height="16" rx="3" fill="#dbe7fb" stroke="none"/>
<text x="225.53846153846155" y="133" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">60s</text>
<text x="20" y="173" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">客户端看门狗</text>
<rect x="120" y="160" width="118.46153846153845" height="16" rx="3" fill="#2f6fdf" stroke="none"/>
<text x="242.46153846153845" y="173" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">70s</text>
<text x="20" y="213" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">推送 location</text>
<rect x="120" y="200" width="203.0769230769231" height="16" rx="3" fill="#dbe7fb" stroke="none"/>
<text x="327.0769230769231" y="213" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">120s</text>
<line x1="221.53846153846155" y1="66" x2="221.53846153846155" y2="236" stroke="#656d76" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="272" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">心跳比最短的空闲超时短，连接才不会被悄悄掐掉；</text>
<text x="20" y="288" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">看门狗约等于两次心跳多一点，收不到就主动重连</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="399" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">刷新令牌的轮换与重放检测</text>
<text x="20" y="62" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">正常续期：每次续期换一张新票，旧票作废</text>
<rect x="28" y="76" width="88" height="34" rx="6" fill="#e6e9ed" stroke="none"/>
<text x="72" y="98" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">R1（已用）</text>
<rect x="36" y="132" width="72" height="26" rx="6" fill="#dbe7fb" stroke="none"/>
<text x="72" y="149" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">A1 · 15 分钟</text>
<line x1="72" y1="110" x2="72" y2="127" stroke="#656d76" stroke-width="1.2"/>
<path d="M68,126 L72,132 L76,126 Z" fill="#656d76"/>
<line x1="116" y1="93" x2="131" y2="93" stroke="#656d76" stroke-width="1.2"/>
<path d="M130,89 L136,93 L130,97 Z" fill="#656d76"/>
<rect x="136" y="76" width="88" height="34" rx="6" fill="#e6e9ed" stroke="none"/>
<text x="180" y="98" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">R2（已用）</text>
<rect x="144" y="132" width="72" height="26" rx="6" fill="#dbe7fb" stroke="none"/>
<text x="180" y="149" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">A2 · 15 分钟</text>
<line x1="180" y1="110" x2="180" y2="127" stroke="#656d76" stroke-width="1.2"/>
<path d="M176,126 L180,132 L184,126 Z" fill="#656d76"/>
<line x1="224" y1="93" x2="239" y2="93" stroke="#656d76" stroke-width="1.2"/>
<path d="M238,89 L244,93 L238,97 Z" fill="#656d76"/>
<rect x="244" y="76" width="88" height="34" rx="6" fill="#2f6fdf" stroke="none"/>
<text x="288" y="98" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">R3（可用）</text>
<rect x="252" y="132" width="72" height="26" rx="6" fill="#dbe7fb" stroke="none"/>
<text x="288" y="149" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">A3 · 15 分钟</text>
<line x1="288" y1="110" x2="288" y2="127" stroke="#656d76" stroke-width="1.2"/>
<path d="M284,126 L288,132 L292,126 Z" fill="#656d76"/>
<text x="20" y="180" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">R：刷新令牌，库里只存哈希，30 天　A：访问令牌</text>
<line x1="20" y1="196" x2="340" y2="196" stroke="#d8dee4" stroke-width="1.2"/>
<text x="20" y="222" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">重放：用过的票又出现</text>
<rect x="28" y="236" width="120" height="40" rx="6" fill="#e6e9ed" stroke="none"/>
<text x="88" y="252" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">有人拿 R1</text>
<text x="88" y="268" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">再来续期</text>
<line x1="148" y1="256" x2="191" y2="256" stroke="#2f6fdf" stroke-width="1.2"/>
<path d="M190,252 L196,256 L190,260 Z" fill="#2f6fdf"/>
<rect x="196" y="236" width="136" height="40" rx="6" fill="#2f6fdf" stroke="none"/>
<text x="264" y="252" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">这台设备的票</text>
<text x="264" y="268" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">全部作废</text>
<text x="20" y="298" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">分不清谁是真用户，宁可让真用户重登一次</text>
<line x1="20" y1="314" x2="340" y2="314" stroke="#d8dee4" stroke-width="1.2"/>
<text x="20" y="340" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">例外：续期回包丢在路上</text>
<text x="20" y="362" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">24 小时内、R2 还没被任何人用过：拿 R1 重来</text>
<text x="20" y="380" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">照样算数，同时作废那张没人收到的 R2</text>
</svg>

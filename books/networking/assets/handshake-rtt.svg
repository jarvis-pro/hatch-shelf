<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" width="360" height="344" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="343" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">握手方式与首字节延迟</text>
<text x="20" y="68" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">TCP + TLS 1.2</text>
<rect x="20" y="76" width="300" height="26" rx="4" fill="#e6e9ed"/>
<text x="28" y="94" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">4 RTT · 400 ms</text>
<text x="20" y="130" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">TCP + TLS 1.3</text>
<rect x="20" y="138" width="224" height="26" rx="4" fill="#dbe7fb"/>
<text x="28" y="156" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">3 RTT · 300 ms</text>
<text x="20" y="192" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">QUIC 首次连接</text>
<rect x="20" y="200" width="148" height="26" rx="4" fill="#2f6fdf"/>
<text x="28" y="218" font-size="12" fill="#ffffff" text-anchor="start" font-weight="normal">2 RTT · 200 ms</text>
<text x="20" y="254" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">QUIC 0-RTT 恢复</text>
<rect x="20" y="262" width="72" height="26" rx="4" fill="#2f6fdf"/>
<text x="100" y="280" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1 RTT · 100 ms</text>
<text x="180" y="310" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">收到第一个响应字节前的往返次数</text>
<text x="180" y="326" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">按 RTT = 100 ms 换算，不计服务端处理时间</text>
</svg>

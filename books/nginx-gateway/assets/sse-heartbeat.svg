<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" width="360" height="344" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="343" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">心跳、看门狗与 nginx 读超时</text>
<text x="20" y="66" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">服务端心跳（每 25 秒）</text>
<line x1="30" y1="92" x2="340" y2="92" stroke="#d8dee4" stroke-width="1"/>
<circle cx="30.0" cy="92" r="4" fill="#2f6fdf"/>
<circle cx="73.05555555555556" cy="92" r="4" fill="#2f6fdf"/>
<circle cx="116.11111111111111" cy="92" r="4" fill="#2f6fdf"/>
<circle cx="159.16666666666666" cy="92" r="4" fill="#ffffff" stroke="#656d76" stroke-width="1.5"/>
<circle cx="202.22222222222223" cy="92" r="4" fill="#ffffff" stroke="#656d76" stroke-width="1.5"/>
<circle cx="245.27777777777777" cy="92" r="4" fill="#ffffff" stroke="#656d76" stroke-width="1.5"/>
<circle cx="288.3333333333333" cy="92" r="4" fill="#ffffff" stroke="#656d76" stroke-width="1.5"/>
<circle cx="331.3888888888889" cy="92" r="4" fill="#ffffff" stroke="#656d76" stroke-width="1.5"/>
<text x="228.05555555555554" y="114" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">50 秒后网络中断，心跳丢失（空心）</text>
<text x="20" y="150" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">客户端看门狗（70 秒）</text>
<line x1="30" y1="176" x2="340" y2="176" stroke="#d8dee4" stroke-width="1"/>
<rect x="30.0" y="169" width="41.05555555555556" height="14" rx="3" fill="#dbe7fb"/>
<rect x="73.05555555555556" y="169" width="41.05555555555556" height="14" rx="3" fill="#dbe7fb"/>
<rect x="116.11111111111111" y="169" width="120.55555555555554" height="14" rx="3" fill="#2f6fdf"/>
<text x="176.38888888888889" y="180" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">70 秒无数据</text>
<line x1="236.66666666666666" y1="162" x2="236.66666666666666" y2="190" stroke="#1f2328" stroke-width="1.5"/>
<text x="340" y="200" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">120s 判定已死，重连</text>
<text x="30" y="200" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">收到心跳就重新计时</text>
<text x="20" y="234" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">nginx proxy_read_timeout（120 秒）</text>
<line x1="30" y1="260" x2="340" y2="260" stroke="#d8dee4" stroke-width="1"/>
<rect x="30.0" y="253" width="41.05555555555556" height="14" rx="3" fill="#dbe7fb"/>
<rect x="73.05555555555556" y="253" width="41.05555555555556" height="14" rx="3" fill="#dbe7fb"/>
<rect x="116.11111111111111" y="253" width="206.66666666666666" height="14" rx="3" fill="#e6e9ed"/>
<line x1="322.77777777777777" y1="246" x2="322.77777777777777" y2="274" stroke="#656d76" stroke-width="1.5"/>
<text x="219.44444444444446" y="264" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">断网后要到 170s 才触发</text>
<text x="20" y="286" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">正常时每 25 秒被心跳重置，从不触发</text>
<line x1="30" y1="310" x2="340" y2="310" stroke="#656d76" stroke-width="1"/>
<line x1="30.0" y1="310" x2="30.0" y2="314" stroke="#656d76" stroke-width="1"/>
<text x="30.0" y="328" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0s</text>
<line x1="116.11111111111111" y1="310" x2="116.11111111111111" y2="314" stroke="#656d76" stroke-width="1"/>
<text x="116.11111111111111" y="328" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">50s</text>
<line x1="202.22222222222223" y1="310" x2="202.22222222222223" y2="314" stroke="#656d76" stroke-width="1"/>
<text x="202.22222222222223" y="328" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">100s</text>
<line x1="288.3333333333333" y1="310" x2="288.3333333333333" y2="314" stroke="#656d76" stroke-width="1"/>
<text x="288.3333333333333" y="328" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">150s</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="289" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">净收入达到最低可行收入的几成，要多少家店</text>
<text x="180.0" y="46" text-anchor="middle" font-size="11" fill="#656d76">假设：月付 99 元、可变成本 15 元、固定成本 1500 元、M = 2 万元</text>
<line x1="50" y1="230.0" x2="340" y2="230.0" stroke="#d8dee4"/>
<text x="44" y="234.0" text-anchor="end" font-size="11" fill="#656d76">0</text>
<line x1="50" y1="176.7" x2="340" y2="176.7" stroke="#d8dee4"/>
<text x="44" y="180.7" text-anchor="end" font-size="11" fill="#656d76">100</text>
<line x1="50" y1="123.3" x2="340" y2="123.3" stroke="#d8dee4"/>
<text x="44" y="127.3" text-anchor="end" font-size="11" fill="#656d76">200</text>
<line x1="50" y1="70.0" x2="340" y2="70.0" stroke="#d8dee4"/>
<text x="44" y="74.0" text-anchor="end" font-size="11" fill="#656d76">300</text>
<rect x="66.2" y="188.4" width="40" height="41.6" fill="#2f6fdf"/>
<text x="86.2" y="182.4" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">78 家</text>
<text x="86.2" y="246" text-anchor="middle" font-size="12" fill="#1f2328">25%</text>
<rect x="138.8" y="156.9" width="40" height="73.1" fill="#2f6fdf"/>
<text x="158.8" y="150.9" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">137 家</text>
<text x="158.8" y="246" text-anchor="middle" font-size="12" fill="#1f2328">50%</text>
<rect x="211.2" y="124.9" width="40" height="105.1" fill="#dbe7fb"/>
<text x="231.2" y="118.9" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">197 家</text>
<text x="231.2" y="246" text-anchor="middle" font-size="12" fill="#1f2328">75%</text>
<rect x="283.8" y="93.5" width="40" height="136.5" fill="#dbe7fb"/>
<text x="303.8" y="87.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">256 家</text>
<text x="303.8" y="246" text-anchor="middle" font-size="12" fill="#1f2328">100%</text>
<text x="180.0" y="266" text-anchor="middle" font-size="11" fill="#656d76">深色两档是第 6 章建议的辞职评估区间；家数向上取整</text>
<text x="180.0" y="282" text-anchor="middle" font-size="11" fill="#656d76">家数 =（成数 × M + 固定成本）÷（99 − 15）</text>
</svg>
<rect x="16" y="298" width="12" height="12" rx="3" fill="#2f6fdf"/>
<text x="33" y="308" font-size="11" fill="#656d76">有利</text>
<rect x="73" y="298" width="12" height="12" rx="3" fill="#dbe7fb"/>
<text x="90" y="308" font-size="11" fill="#656d76">一般</text>
<rect x="130" y="298" width="12" height="12" rx="3" fill="#e6e9ed"/>
<text x="147" y="308" font-size="11" fill="#656d76">不利</text>
<text x="16" y="330" font-size="11" fill="#656d76">通常情况，各地和各平台口径不一，以最新要求为准</text>

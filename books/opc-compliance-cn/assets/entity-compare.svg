<rect x="187.3" y="251" width="77.3" height="28" rx="5" fill="#2f6fdf"/>
<text x="226.0" y="269.5" font-size="12" fill="#ffffff" text-anchor="middle">低</text>
<rect x="268.7" y="251" width="77.3" height="28" rx="5" fill="#dbe7fb"/>

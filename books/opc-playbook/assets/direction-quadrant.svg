<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" width="360" height="372" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="371" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600" >选方向的两个维度</text>
<rect x="54" y="52" width="136" height="136" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="122.0" y="108" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600" >痛但够不着</text>
<text x="122.0" y="130" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >先建渠道，</text>
<text x="122.0" y="147" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >或找懂行的人</text>
<rect x="194" y="52" width="136" height="136" rx="6" fill="#dbe7fb" stroke="#d8dee4"/>
<text x="262.0" y="108" font-size="14" fill="#2f6fdf" text-anchor="middle" font-weight="600" >优先做</text>
<text x="262.0" y="130" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >有人痛，</text>
<text x="262.0" y="147" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >你也找得到他们</text>
<rect x="54" y="192" width="136" height="136" rx="6" fill="#ffffff" stroke="#d8dee4"/>
<text x="122.0" y="248" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600" >别碰</text>
<text x="122.0" y="270" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >没人痛，</text>
<text x="122.0" y="287" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >也找不到人</text>
<rect x="194" y="192" width="136" height="136" rx="6" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="262.0" y="248" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600" >容易做成玩具</text>
<text x="262.0" y="270" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >找得到人，</text>
<text x="262.0" y="287" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >但没人肯付钱</text>
<text x="192" y="352" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >你能触达这群用户的程度 →</text>
<text x="26" y="190" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" transform="rotate(-90 26 190)">痛点强度与付费意愿 →</text>
</svg>

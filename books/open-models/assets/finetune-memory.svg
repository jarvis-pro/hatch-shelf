<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 216" width="360" height="216" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="215" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">微调 8B 模型的显存（不含激活值）</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">全参数约 16 字节/参数；LoRA 冻结底座</text>
<text x="112" y="87" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">全参数 + Adam</text>
<rect x="120" y="74" width="170.0" height="18" rx="3" fill="#e6e9ed"/>
<text x="296.0" y="87" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 128 GB</text>
<text x="112" y="121" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">LoRA · BF16 底座</text>
<rect x="120" y="108" width="22.2" height="18" rx="3" fill="#2f6fdf"/>
<text x="148.1796875" y="121" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 17 GB</text>
<text x="112" y="155" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">QLoRA · NF4 底座</text>
<rect x="120" y="142" width="6.6" height="18" rx="3" fill="#2f6fdf"/>
<text x="132.640625" y="155" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 5.0 GB</text>
<text x="180" y="198" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">激活值另算，随 batch 和序列长度增长</text>

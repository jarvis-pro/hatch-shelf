<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" width="360" height="352" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="351" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">8B 模型在不同 GGUF 格式下的文件大小</text>
<text x="180" y="50" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">按平均位宽估算：参数量 × 位宽 ÷ 8</text>
<text x="72" y="87" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">F16</text>
<rect x="80" y="74" width="210.0" height="18" rx="3" fill="#e6e9ed"/>
<text x="296.0" y="87" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 16.0 GB</text>
<text x="72" y="121" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">Q8_0</text>
<rect x="80" y="108" width="111.6" height="18" rx="3" fill="#e6e9ed"/>
<text x="197.5625" y="121" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 8.5 GB</text>
<text x="72" y="155" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">Q6_K</text>
<rect x="80" y="142" width="86.1" height="18" rx="3" fill="#e6e9ed"/>
<text x="172.1" y="155" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 6.6 GB</text>
<text x="72" y="189" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">Q5_K_M</text>
<rect x="80" y="176" width="74.8" height="18" rx="3" fill="#2f6fdf"/>
<text x="160.8125" y="189" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 5.7 GB</text>
<text x="72" y="223" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">Q4_K_M</text>
<rect x="80" y="210" width="64.3" height="18" rx="3" fill="#2f6fdf"/>
<text x="150.3125" y="223" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 4.9 GB</text>
<text x="72" y="257" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">Q3_K_M</text>
<rect x="80" y="244" width="51.2" height="18" rx="3" fill="#e6e9ed"/>
<text x="137.1875" y="257" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 3.9 GB</text>
<text x="72" y="291" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">Q2_K</text>
<rect x="80" y="278" width="39.4" height="18" rx="3" fill="#e6e9ed"/>
<text x="125.375" y="291" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">约 3.0 GB</text>
<text x="180" y="334" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">蓝色为常用的平衡区间；实际大小随模型结构略有出入</text>
</svg>

<text x="340.0" y="266" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal" >30</text>
<text x="196.0" y="284" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" >天数</text>
<text x="16" y="160.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" transform="rotate(-90 16 160.0)">累计分钟</text>
<line x1="52.0" y1="250.0" x2="340.0" y2="70.0" stroke="#656d76" stroke-width="2" stroke-dasharray="5 4"/>

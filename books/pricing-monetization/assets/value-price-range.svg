<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">价格落在哪个区间</text>
<rect x="30" y="120" width="300" height="26" rx="4" fill="#e6e9ed"/>
<rect x="150" y="120" width="110" height="26" rx="4" fill="#dbe7fb"/>
<rect x="30" y="120" width="60" height="26" rx="4" fill="#ffffff" stroke="#d8dee4"/>
<text x="60.0" y="137.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">亏钱</text>
<text x="205.0" y="137.0" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600">可定价区间</text>
<text x="295.0" y="137.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">卖不动</text>
<line x1="90" y1="90" x2="90" y2="160" stroke="#656d76" stroke-width="1.5"/>
<line x1="150" y1="90" x2="150" y2="160" stroke="#2f6fdf" stroke-width="1.5"/>
<line x1="260" y1="90" x2="260" y2="160" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="90.0" y="70.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">成本底线</text>
<text x="90.0" y="86.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">可变成本</text>
<text x="150.0" y="196.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">替代方案价格</text>
<text x="150.0" y="212.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">竞品、Excel、人工</text>
<text x="260.0" y="70.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">感知价值上限</text>
<text x="260.0" y="86.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">省下或多赚的钱</text>
<line x1="30" y1="236" x2="330" y2="236" stroke="#656d76"/>
<path d="M330 236 l-7 -4 v8 z" fill="#656d76"/>
<text x="330.0" y="254.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">价格 →</text>
<text x="180.0" y="282.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">差异化越强，可定价区间越往右延伸</text>
</svg>

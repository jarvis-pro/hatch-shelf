<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" width="360" height="332" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="331" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">一个示例漏斗</text>
<text x="180.0" y="48.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">条宽按人数取对数，右侧是相对上一步的转化率</text>
<rect x="30.0" y="66" width="300.0" height="34" rx="5" fill="#2f6fdf"/>
<text x="180.0" y="81.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">访问着陆页</text>
<text x="180.0" y="95.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">10,000</text>
<rect x="64.5" y="114" width="230.9" height="34" rx="5" fill="#dbe7fb"/>
<text x="180.0" y="129.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">注册</text>
<text x="180.0" y="143.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">1,200</text>
<text x="344.0" y="111.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">↓ 12%</text>
<rect x="75.8" y="162" width="208.4" height="34" rx="5" fill="#dbe7fb"/>
<text x="180.0" y="177.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">完成首次核心动作</text>
<text x="180.0" y="191.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">600</text>
<text x="344.0" y="159.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">↓ 50%</text>
<rect x="88.8" y="210" width="182.4" height="34" rx="5" fill="#dbe7fb"/>
<text x="180.0" y="225.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">7 天内回访</text>
<text x="180.0" y="239.0" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">270</text>
<text x="344.0" y="207.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">↓ 45%</text>
<rect x="115.0" y="258" width="129.9" height="34" rx="5" fill="#2f6fdf"/>
<text x="180.0" y="273.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">付费</text>
<text x="180.0" y="287.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">54</text>
<text x="344.0" y="255.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">↓ 20%</text>
<text x="180.0" y="314.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">整体：54 ÷ 10,000 = 0.54%</text>
</svg>

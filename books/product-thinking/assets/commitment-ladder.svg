<svg xmlns="http://www.w3.org/2000/svg" width="360" height="372" viewBox="0 0 360 372" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="371" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">承诺强度阶梯</text>
<text x="180.0" y="50" text-anchor="middle" font-size="12" fill="#656d76">越往上，对方付出越多，信号越可信</text>
<rect x="40" y="66" width="280" height="28" rx="6" fill="#2f6fdf"/>
<text x="52" y="85" font-size="13" font-weight="600" fill="#ffffff">全款预售 / 付费内测</text>
<text x="52" y="111" font-size="12" fill="#656d76">付出：全价，承诺按时交付</text>
<rect x="40" y="124" width="240" height="28" rx="6" fill="#2f6fdf"/>
<text x="52" y="143" font-size="13" font-weight="600" fill="#ffffff">付定金</text>
<text x="52" y="169" font-size="12" fill="#656d76">付出：一笔小钱，做不出来全退</text>
<rect x="40" y="182" width="200" height="28" rx="6" fill="#dbe7fb"/>
<text x="52" y="201" font-size="13" font-weight="600" fill="#1f2328">预约演示 / 约访谈</text>
<text x="52" y="227" font-size="12" fill="#656d76">付出：一段固定的时间</text>
<rect x="40" y="240" width="160" height="28" rx="6" fill="#e6e9ed"/>
<text x="52" y="259" font-size="13" font-weight="600" fill="#1f2328">留邮箱 / 加微信</text>
<text x="52" y="285" font-size="12" fill="#656d76">付出：联系方式</text>
<rect x="40" y="298" width="120" height="28" rx="6" fill="#e6e9ed"/>
<text x="52" y="317" font-size="13" font-weight="600" fill="#1f2328">点赞、说「想要」</text>
<text x="52" y="343" font-size="12" fill="#656d76">付出：几乎为零</text>
<line x1="24" y1="326" x2="24" y2="74" stroke="#656d76" stroke-width="1.5"/>
<path d="M19 82 L24 70 L29 82 Z" fill="#656d76"/>
</svg>

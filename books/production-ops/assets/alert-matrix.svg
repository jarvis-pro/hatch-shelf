<text x="284.0" y="134.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">非核心功能报错</text>
<text x="284.0" y="152.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">备份心跳超时</text>

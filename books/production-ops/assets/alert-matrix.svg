<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" width="360" height="326" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="325" rx="10" fill="#ffffff" stroke="#d8dee4"/>

<text x="284.0" y="66.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="600">不急，也不恶化</text>
<text x="74.0" y="122.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="600">影响</text>
<text x="74.0" y="138.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="600">用户</text>
<text x="74.0" y="226.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="600">不影响</text>
<text x="74.0" y="242.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="600">用户</text>
<rect x="84" y="76" width="128" height="96" rx="8" fill="#2f6fdf"/>

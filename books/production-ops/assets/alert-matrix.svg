<text x="148.0" y="134.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">全站不可用</text>
<text x="148.0" y="152.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">证书已过期</text>
<rect x="220" y="76" width="128" height="96" rx="8" fill="#dbe7fb"/>

<text x="284.0" y="214.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">删掉</text>
<text x="284.0" y="238.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">CPU 偶尔冲高</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" width="360" height="236" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="235" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180.0" y="30.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">RPO 与 RTO</text>
<rect x="50" y="70" width="140" height="26" rx="4" fill="#dbe7fb"/>
<text x="120.0" y="88.0" font-size="12" fill="#2f6fdf" text-anchor="middle" font-weight="600">这段时间写入的数据丢失</text>
<rect x="190" y="70" width="120" height="26" rx="4" fill="#e6e9ed"/>
<text x="250.0" y="88.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">服务不可用</text>
<line x1="24.0" y1="120.0" x2="340.0" y2="120.0" stroke="#656d76" stroke-width="1.5"/>
<polygon points="340,120 333,116 333,124" fill="#656d76"/>
<circle cx="50" cy="120" r="5" fill="#2f6fdf"/>
<text x="50.0" y="142.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">上次备份</text>
<circle cx="190" cy="120" r="5" fill="#2f6fdf"/>
<text x="190.0" y="142.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">故障发生</text>
<circle cx="310" cy="120" r="5" fill="#2f6fdf"/>
<text x="310.0" y="142.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">服务恢复</text>
<text x="345.0" y="112.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">时间</text>
<line x1="50.0" y1="162.0" x2="190.0" y2="162.0" stroke="#2f6fdf" stroke-width="1.5"/>
<line x1="50.0" y1="156.0" x2="50.0" y2="168.0" stroke="#2f6fdf" stroke-width="1.5"/>
<line x1="190.0" y1="156.0" x2="190.0" y2="168.0" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="120.0" y="184.0" font-size="13" fill="#2f6fdf" text-anchor="middle" font-weight="600">RPO：最多丢多少数据</text>
<line x1="190.0" y1="162.0" x2="310.0" y2="162.0" stroke="#656d76" stroke-width="1.5"/>
<line x1="310.0" y1="156.0" x2="310.0" y2="168.0" stroke="#656d76" stroke-width="1.5"/>
<text x="250.0" y="184.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">RTO：最多停多久</text>
<text x="180.0" y="216.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">备份越频繁，RPO 越短；恢复流程越熟练，RTO 越短</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" width="360" height="312" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="311" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">axis 决定沿哪个方向压缩</text>
<text x="180" y="52" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">a = [[1, 2, 3], [4, 5, 6]]，shape (2, 3)</text>
<rect x="70" y="78" width="40" height="32" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="90.0" y="99.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">1</text>
<rect x="110" y="78" width="40" height="32" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="130.0" y="99.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">2</text>
<rect x="150" y="78" width="40" height="32" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="170.0" y="99.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">3</text>
<rect x="70" y="110" width="40" height="32" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="90.0" y="131.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">4</text>
<rect x="110" y="110" width="40" height="32" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="130.0" y="131.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">5</text>
<rect x="150" y="110" width="40" height="32" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="170.0" y="131.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="normal">6</text>
<line x1="90" y1="148" x2="90" y2="176" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="130" y1="148" x2="130" y2="176" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="170" y1="148" x2="170" y2="176" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="70" y="182" width="40" height="32" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="90.0" y="203.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">5</text>
<rect x="110" y="182" width="40" height="32" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="130.0" y="203.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">7</text>
<rect x="150" y="182" width="40" height="32" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="170.0" y="203.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">9</text>
<text x="130" y="238" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">sum(axis=0) → shape (3,)</text>
<text x="130" y="256" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">每一列压成一个数</text>
<line x1="196" y1="94" x2="236" y2="94" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="196" y1="126" x2="236" y2="126" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="242" y="78" width="40" height="32" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="262.0" y="99.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">6</text>
<rect x="242" y="110" width="40" height="32" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="262.0" y="131.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">15</text>
<text x="262" y="168" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">sum(axis=1)</text>
<text x="262" y="186" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">→ shape (2,)</text>
<text x="262" y="204" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">每一行压成一个数</text>
<text x="180" y="290" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">规律：axis=k 就是让 shape 的第 k 维消失</text>
</svg>

<text x="136.0" y="107" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">0–400</text>
<rect x="102.0" y="126" width="104.0" height="22" rx="4" fill="#dbe7fb" stroke="#2f6fdf"/>
<rect x="102.0" y="126" width="26.0" height="22" rx="4" fill="#2f6fdf" fill-opacity="0.35"/>
<text x="167.0" y="141" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">块 2</text>
<text x="94.0" y="141" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">300–700</text>
<rect x="180.0" y="160" width="104.0" height="22" rx="4" fill="#dbe7fb" stroke="#2f6fdf"/>
<rect x="180.0" y="160" width="26.0" height="22" rx="4" fill="#2f6fdf" fill-opacity="0.35"/>
<text x="245.0" y="175" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">块 3</text>
<text x="172.0" y="175" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">600–1000</text>
<rect x="232.0" y="194" width="104.0" height="22" rx="4" fill="#dbe7fb" stroke="#2f6fdf"/>
<rect x="232.0" y="194" width="52.0" height="22" rx="4" fill="#2f6fdf" fill-opacity="0.35"/>
<text x="310.0" y="209" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">块 4</text>
<text x="224.0" y="209" font-size="12" fill="#656d76" text-anchor="end" font-weight="normal">800–1200</text>
<rect x="40" y="240" width="14" height="12" rx="2" fill="#dbe7fb" stroke="#2f6fdf"/><text x="60" y="250" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">块：400 token</text>
<rect x="170" y="240" width="14" height="12" rx="2" fill="#2f6fdf" fill-opacity="0.35"/><text x="190" y="250" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">与前一块重叠：100</text>
<text x="180" y="276" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">最后一块对齐到文末，重叠会比设定的多</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 274" width="360" height="274" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="273" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">同步渲染 vs 切片渲染（示意）</text>
<line x1="70" y1="196" x2="340" y2="196" stroke="#d8dee4"/>
<line x1="70.0" y1="196" x2="70.0" y2="200" stroke="#656d76"/>
<text x="70.0" y="214" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">0</text>
<line x1="124.0" y1="196" x2="124.0" y2="200" stroke="#656d76"/>
<text x="124.0" y="214" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">10</text>
<line x1="178.0" y1="196" x2="178.0" y2="200" stroke="#656d76"/>
<text x="178.0" y="214" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">20</text>
<line x1="232.0" y1="196" x2="232.0" y2="200" stroke="#656d76"/>
<text x="232.0" y="214" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">30</text>
<line x1="286.0" y1="196" x2="286.0" y2="200" stroke="#656d76"/>
<text x="286.0" y="214" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">40</text>
<line x1="340.0" y1="196" x2="340.0" y2="200" stroke="#656d76"/>
<text x="340.0" y="214" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">50</text>
<text x="340" y="230" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">时间（ms）</text>
<line x1="134.8" y1="52" x2="134.8" y2="196" stroke="#656d76" stroke-dasharray="3 3"/>
<text x="134.8" y="62" font-size="11" fill="#656d76" text-anchor="middle" font-weight="normal">按键</text>
<text x="62" y="96" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">同步</text>
<rect x="70.0" y="78" width="216.0" height="26" rx="4" fill="#2f6fdf"/>
<rect x="286.0" y="78" width="16.2" height="26" rx="2" fill="#1f2328"/>
<text x="294.1" y="120" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">40ms 后才处理按键</text>
<text x="62" y="156" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">切片</text>
<rect x="70.0" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="100.2" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="130.5" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="157.5" y="138" width="16.2" height="26" rx="2" fill="#1f2328"/>
<rect x="173.7" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="203.9" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="234.2" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="264.4" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<rect x="294.6" y="138" width="26.0" height="26" rx="3" fill="#2f6fdf"/>
<text x="151.0" y="180" font-size="11" fill="#656d76" text-anchor="start" font-weight="normal">下一次让出时处理按键</text>
<rect x="70" y="242" width="14" height="14" rx="3" fill="#2f6fdf"/>
<text x="90" y="254" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">React 渲染</text>
<rect x="190" y="242" width="14" height="14" rx="3" fill="#1f2328"/>
<text x="210" y="254" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">处理按键</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" width="360" height="392" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="391" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">固定窗口的边界突发</text>
<text x="180" y="48" font-size="12" fill="#656d76" text-anchor="middle">限额：每分钟 10 次</text>
<text x="16" y="78" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">固定窗口</text>
<rect x="40" y="90" width="150.0" height="90" fill="#dbe7fb" opacity="0.5"/>
<line x1="190.0" y1="90" x2="190.0" y2="180" stroke="#656d76" stroke-dasharray="3 3"/>
<rect x="164.2" y="130" width="14" height="50" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="171.25" y="124" font-size="11" fill="#1f2328" text-anchor="middle">10 次</text>
<rect x="201.8" y="130" width="14" height="50" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="208.75" y="124" font-size="11" fill="#1f2328" text-anchor="middle">10 次</text>
<line x1="40" y1="180" x2="340" y2="180" stroke="#656d76"/>
<text x="46" y="106" font-size="11" fill="#656d76" text-anchor="start">窗口 A：10 次</text>
<text x="334" y="106" font-size="11" fill="#656d76" text-anchor="end">窗口 B：10 次</text>
<text x="180" y="196" font-size="12" fill="#1f2328" text-anchor="middle">两个窗口各自没超限，2 秒内放过 20 次</text>
<text x="16" y="232" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">滑动窗口</text>
<rect x="40" y="244" width="150.0" height="90" fill="#dbe7fb" opacity="0.5"/>
<line x1="190.0" y1="244" x2="190.0" y2="334" stroke="#656d76" stroke-dasharray="3 3"/>
<rect x="164.2" y="284" width="14" height="50" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="171.25" y="278" font-size="11" fill="#1f2328" text-anchor="middle">10 次</text>
<rect x="201.8" y="284" width="14" height="50" fill="#e6e9ed" stroke="#656d76"/>
<text x="208.75" y="278" font-size="11" fill="#1f2328" text-anchor="middle">10 次</text>
<line x1="40" y1="334" x2="340" y2="334" stroke="#656d76"/>
<text x="334" y="260" font-size="11" fill="#656d76" text-anchor="end">过去 60 秒已满 10 次</text>
<text x="40.0" y="350" font-size="11" fill="#656d76" text-anchor="middle">0:52</text>
<text x="115.0" y="350" font-size="11" fill="#656d76" text-anchor="middle">0:56</text>
<text x="190.0" y="350" font-size="11" fill="#656d76" text-anchor="middle">1:00</text>
<text x="265.0" y="350" font-size="11" fill="#656d76" text-anchor="middle">1:04</text>
<text x="340.0" y="350" font-size="11" fill="#656d76" text-anchor="middle">1:08</text>
<rect x="96" y="360" width="12" height="12" fill="#2f6fdf"/>
<text x="114" y="370" font-size="12" fill="#1f2328" text-anchor="start">放行</text>
<rect x="196" y="360" width="12" height="12" fill="#e6e9ed" stroke="#656d76"/>
<text x="214" y="370" font-size="12" fill="#1f2328" text-anchor="start">拒绝（429）</text>
</svg>

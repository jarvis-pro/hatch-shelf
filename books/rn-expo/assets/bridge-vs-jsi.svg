<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="360" height="310" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="309" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Bridge 与 JSI：JS 怎么调到原生</text>
<text x="20" y="60" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">旧架构：Bridge</text>
<rect x="16" y="74" width="60" height="40" rx="6" fill="#dbe7fb"/>
<text x="46" y="99" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">JS</text>
<rect x="96" y="74" width="76" height="40" rx="6" fill="#e6e9ed"/>
<text x="134" y="92" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">序列化</text>
<text x="134" y="107" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">成 JSON</text>
<rect x="192" y="74" width="64" height="40" rx="6" fill="#e6e9ed"/>
<text x="224" y="92" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">异步</text>
<text x="224" y="107" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">队列</text>
<rect x="276" y="74" width="68" height="40" rx="6" fill="#e6e9ed"/>
<text x="310" y="92" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">解析后</text>
<text x="310" y="107" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">调原生</text>
<line x1="76" y1="94" x2="95" y2="94" stroke="#656d76" stroke-width="1" marker-end="url(#ar)"/>
<line x1="172" y1="94" x2="191" y2="94" stroke="#656d76" stroke-width="1" marker-end="url(#ar)"/>
<line x1="256" y1="94" x2="275" y2="94" stroke="#656d76" stroke-width="1" marker-end="url(#ar)"/>
<line x1="310" y1="122" x2="46" y2="122" stroke="#656d76" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="178" y="140" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">结果再序列化，异步回调送回</text>
<line x1="16" y1="168" x2="344" y2="168" stroke="#d8dee4" stroke-width="1"/>
<text x="20" y="196" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">新架构：JSI</text>
<rect x="16" y="210" width="60" height="40" rx="6" fill="#dbe7fb"/>
<text x="46" y="235" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">JS</text>
<rect x="116" y="210" width="128" height="40" rx="6" fill="#2f6fdf"/>
<text x="180" y="228" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">HostObject</text>
<text x="180" y="243" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">（C++ 宿主对象）</text>
<rect x="284" y="210" width="60" height="40" rx="6" fill="#e6e9ed"/>
<text x="314" y="235" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">原生</text>
<line x1="76" y1="230" x2="115" y2="230" stroke="#656d76" stroke-width="1" marker-end="url(#ar)"/>
<line x1="244" y1="230" x2="283" y2="230" stroke="#656d76" stroke-width="1" marker-end="url(#ar)"/>
<text x="180" y="274" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">JS 直接持有引用，同步调用、立即返回</text>
<text x="180" y="292" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">数字、字符串、ArrayBuffer 无需转 JSON</text>
</svg>

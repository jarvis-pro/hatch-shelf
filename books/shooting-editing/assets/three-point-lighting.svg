<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="379" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">三点布光俯视图（口播）</text>
<rect x="30" y="44" width="300" height="14" fill="#e6e9ed"/>
<text x="180" y="55" font-size="11" fill="#656d76" text-anchor="middle">背景墙（人离墙 1–2 米）</text>
<line x1="180" y1="160" x2="95" y2="245" stroke="#2f6fdf" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="180" y1="160" x2="275" y2="235" stroke="#656d76" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="180" y1="160" x2="255" y2="95" stroke="#656d76" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="180" y1="160" x2="180" y2="290" stroke="#d8dee4" stroke-width="1.5"/>
<circle cx="180" cy="160" r="22" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="2"/>
<text x="180" y="165" font-size="13" fill="#1f2328" text-anchor="middle">人</text>
<rect x="68" y="232" width="44" height="30" rx="4" fill="#2f6fdf" transform="rotate(45 90 247)"/>
<text x="62" y="290" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">主光</text>
<text x="62" y="306" font-size="11" fill="#656d76" text-anchor="middle">45°，略高于头</text>
<rect x="262" y="222" width="34" height="24" rx="4" fill="#dbe7fb" stroke="#2f6fdf" transform="rotate(-38 279 234)"/>
<text x="298" y="276" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">辅光</text>
<text x="298" y="292" font-size="11" fill="#656d76" text-anchor="middle">亮度为主光一半</text>
<circle cx="258" cy="92" r="11" fill="#e6e9ed" stroke="#656d76"/>
<text x="292" y="88" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">轮廓光</text>
<text x="276" y="104" font-size="11" fill="#656d76" text-anchor="start">身后斜上方</text>
<rect x="164" y="290" width="32" height="20" rx="3" fill="#1f2328"/>
<circle cx="180" cy="300" r="5" fill="#ffffff"/>
<text x="180" y="326" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">机位</text>
<text x="180" y="342" font-size="11" fill="#656d76" text-anchor="middle">镜头与眼睛同高</text>
<rect x="24" y="356" width="12" height="12" rx="2" fill="#2f6fdf"/>
<text x="42" y="366" font-size="11" fill="#1f2328">最亮</text>
<rect x="96" y="356" width="12" height="12" rx="2" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="114" y="366" font-size="11" fill="#1f2328">柔和补光</text>
<rect x="184" y="356" width="12" height="12" rx="2" fill="#e6e9ed" stroke="#656d76"/>
<text x="202" y="366" font-size="11" fill="#1f2328">小功率，可省</text>
</svg>

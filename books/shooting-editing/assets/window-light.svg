<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">窗光的三种站位（俯视）</text>
<g>
<rect x="16" y="48" width="100" height="10" fill="#2f6fdf"/>
<text x="66" y="74" font-size="11" fill="#656d76" text-anchor="middle">窗</text>
<rect x="62" y="104" width="24" height="16" rx="3" fill="#1f2328"/>
<circle cx="66" cy="176" r="14" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="2"/>
<text x="66" y="218" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">面对窗</text>
<text x="66" y="236" font-size="11" fill="#656d76" text-anchor="middle">最均匀，最安全</text>
<text x="66" y="252" font-size="11" fill="#656d76" text-anchor="middle">机位在人和窗之间</text>
</g>
<g>
<rect x="130" y="48" width="10" height="100" fill="#2f6fdf"/>
<circle cx="180" cy="100" r="14" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="2"/>
<rect x="196" y="160" width="24" height="16" rx="3" fill="#1f2328" transform="rotate(-30 208 168)"/>
<text x="180" y="218" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">窗在侧前方</text>
<text x="180" y="236" font-size="11" fill="#656d76" text-anchor="middle">有立体感</text>
<text x="180" y="252" font-size="11" fill="#656d76" text-anchor="middle">暗面放反光板</text>
<rect x="222" y="84" width="6" height="34" fill="#e6e9ed" stroke="#656d76"/>
</g>
<g>
<rect x="244" y="48" width="100" height="10" fill="#2f6fdf"/>
<circle cx="294" cy="100" r="14" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="2"/>
<rect x="282" y="176" width="24" height="16" rx="3" fill="#1f2328"/>
<line x1="258" y1="66" x2="330" y2="134" stroke="#656d76" stroke-width="2"/>
<line x1="330" y1="66" x2="258" y2="134" stroke="#656d76" stroke-width="2"/>
<text x="294" y="218" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">背对窗</text>
<text x="294" y="236" font-size="11" fill="#656d76" text-anchor="middle">脸黑、背景过曝</text>
<text x="294" y="252" font-size="11" fill="#656d76" text-anchor="middle">避免</text>
</g>
<rect x="24" y="270" width="12" height="12" rx="2" fill="#2f6fdf"/>
<text x="42" y="280" font-size="11" fill="#1f2328">窗</text>
<rect x="80" y="270" width="12" height="12" rx="2" fill="#1f2328"/>
<text x="98" y="280" font-size="11" fill="#1f2328">机位</text>
<rect x="144" y="270" width="12" height="12" rx="2" fill="#e6e9ed" stroke="#656d76"/>
<text x="162" y="280" font-size="11" fill="#1f2328">反光板</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="354" viewBox="0 0 360 354" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="353" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="20" y="32" font-size="15" font-weight="600" fill="#1f2328">一个人一年能卖出多少小时</text>
<text x="20" y="52" font-size="12" fill="#656d76">假设：每周工作 40 小时，单位：小时</text>
<text x="20" y="74" font-size="13" fill="#1f2328">全年 52 周 × 40 小时</text>
<rect x="20" y="82" width="260.0" height="20" rx="3" fill="#e6e9ed"/>
<text x="288.0" y="97" font-size="13" font-weight="600" fill="#1f2328">2080</text>
<text x="20" y="126" font-size="13" fill="#1f2328">扣掉 13 天法定节假日</text>
<rect x="20" y="134" width="247.0" height="20" rx="3" fill="#e6e9ed"/>
<text x="275.0" y="149" font-size="13" font-weight="600" fill="#1f2328">1976</text>
<text x="20" y="178" font-size="13" fill="#1f2328">再扣 20 天休假和病事假</text>
<rect x="20" y="186" width="227.0" height="20" rx="3" fill="#e6e9ed"/>
<text x="255.0" y="201" font-size="13" font-weight="600" fill="#1f2328">1816</text>
<text x="20" y="230" font-size="13" fill="#1f2328">扣掉 40% 不计费的工作</text>
<rect x="20" y="238" width="136.2" height="20" rx="3" fill="#dbe7fb"/>
<text x="164.2" y="253" font-size="13" font-weight="600" fill="#1f2328">1090</text>
<text x="20" y="282" font-size="13" fill="#1f2328">按 80% 利用率实际卖出</text>
<rect x="20" y="290" width="109.0" height="20" rx="3" fill="#2f6fdf"/>
<text x="137.0" y="305" font-size="13" font-weight="600" fill="#1f2328">872</text>
<text x="20" y="336" font-size="12" fill="#656d76">浅蓝：可卖工时　深蓝：实际卖出的工时</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" width="360" height="382" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<rect x="0.5" y="0.5" width="359" height="381" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">两种隔离：事务回滚 vs 模板库</text>
<text x="92" y="58" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">事务回滚</text>
<rect x="20" y="70" width="144" height="40" rx="6" fill="#e6e9ed"/>
<text x="92" y="95" font-size="12" fill="#1f2328" text-anchor="middle">一个共享测试库</text>
<line x1="92" y1="110" x2="92" y2="124" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="32" y="126" width="120" height="32" rx="6" fill="#dbe7fb"/>
<text x="92" y="147" font-size="12" fill="#1f2328" text-anchor="middle">BEGIN</text>
<line x1="92" y1="158" x2="92" y2="170" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="32" y="170" width="120" height="32" rx="6" fill="#dbe7fb"/>
<text x="92" y="191" font-size="12" fill="#1f2328" text-anchor="middle">测试读写 tx</text>
<line x1="92" y1="202" x2="92" y2="214" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="32" y="214" width="120" height="32" rx="6" fill="#dbe7fb"/>
<text x="92" y="235" font-size="12" fill="#1f2328" text-anchor="middle">ROLLBACK</text>
<rect x="32" y="264" width="120" height="32" rx="6" fill="#ffffff" stroke="#656d76" stroke-dasharray="4 3"/>
<text x="92" y="285" font-size="12" fill="#656d76" text-anchor="middle">COMMIT 不会发生</text>
<text x="92" y="318" font-size="12" fill="#656d76" text-anchor="middle">快，但提交时的事</text>
<text x="92" y="336" font-size="12" fill="#656d76" text-anchor="middle">测不到：可延迟约束、</text>
<text x="92" y="354" font-size="12" fill="#656d76" text-anchor="middle">NOTIFY、提交时触发器</text>
<text x="268" y="58" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">模板库拷贝</text>
<rect x="196" y="70" width="144" height="40" rx="6" fill="#2f6fdf"/>
<text x="268" y="88" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">模板库</text>
<text x="268" y="103" font-size="11" fill="#ffffff" text-anchor="middle">迁移只跑一次</text>
<text x="268" y="127" font-size="11" fill="#656d76" text-anchor="middle">CREATE DATABASE … TEMPLATE</text>
<line x1="268" y1="134" x2="220" y2="152" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="200" y="154" width="40" height="40" rx="6" fill="#dbe7fb"/>
<text x="220" y="172" font-size="11" fill="#1f2328" text-anchor="middle">文件</text>
<text x="220" y="187" font-size="11" fill="#1f2328" text-anchor="middle">A 库</text>
<line x1="268" y1="134" x2="268" y2="152" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="248" y="154" width="40" height="40" rx="6" fill="#dbe7fb"/>
<text x="268" y="172" font-size="11" fill="#1f2328" text-anchor="middle">文件</text>
<text x="268" y="187" font-size="11" fill="#1f2328" text-anchor="middle">B 库</text>
<line x1="268" y1="134" x2="316" y2="152" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="296" y="154" width="40" height="40" rx="6" fill="#dbe7fb"/>
<text x="316" y="172" font-size="11" fill="#1f2328" text-anchor="middle">文件</text>
<text x="316" y="187" font-size="11" fill="#1f2328" text-anchor="middle">C 库</text>
<rect x="204" y="212" width="132" height="32" rx="6" fill="#dbe7fb"/>
<text x="268" y="233" font-size="12" fill="#1f2328" text-anchor="middle">每条测试前清表</text>
<line x1="268" y1="244" x2="268" y2="256" stroke="#656d76" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="204" y="258" width="132" height="32" rx="6" fill="#dbe7fb"/>
<text x="268" y="279" font-size="12" fill="#1f2328" text-anchor="middle">真 COMMIT</text>
<text x="268" y="318" font-size="12" fill="#656d76" text-anchor="middle">文件之间可并行，</text>
<text x="268" y="336" font-size="12" fill="#656d76" text-anchor="middle">提交时的行为照常发生；</text>
<text x="268" y="354" font-size="12" fill="#656d76" text-anchor="middle">拷贝时模板库不能有连接</text>
<line x1="180" y1="50" x2="180" y2="362" stroke="#d8dee4" stroke-width="1"/>
</svg>

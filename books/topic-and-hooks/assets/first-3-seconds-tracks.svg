<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" width="360" height="348" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="347" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">开头 3 秒：三条轨道同时起作用</text>
<line x1="84" y1="64" x2="334" y2="64" stroke="#656d76" stroke-width="1"/>
<line x1="84.0" y1="64" x2="84.0" y2="58" stroke="#656d76" stroke-width="1"/>
<text x="84.0" y="54" font-size="11" fill="#656d76" text-anchor="middle">0s</text>
<line x1="125.7" y1="64" x2="125.7" y2="61" stroke="#656d76" stroke-width="1"/>
<line x1="167.3" y1="64" x2="167.3" y2="58" stroke="#656d76" stroke-width="1"/>
<text x="167.3" y="54" font-size="11" fill="#656d76" text-anchor="middle">1s</text>
<line x1="209.0" y1="64" x2="209.0" y2="61" stroke="#656d76" stroke-width="1"/>
<line x1="250.7" y1="64" x2="250.7" y2="58" stroke="#656d76" stroke-width="1"/>
<text x="250.7" y="54" font-size="11" fill="#656d76" text-anchor="middle">2s</text>
<line x1="292.3" y1="64" x2="292.3" y2="61" stroke="#656d76" stroke-width="1"/>
<line x1="334.0" y1="64" x2="334.0" y2="58" stroke="#656d76" stroke-width="1"/>
<text x="334.0" y="54" font-size="11" fill="#656d76" text-anchor="middle">3s</text>
<text x="70" y="107" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">画面</text>
<rect x="85.0" y="80" width="248.0" height="44" rx="5" fill="#2f6fdf"/>
<text x="209.0" y="99" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">第一帧就是结果、对比或动作</text>
<text x="209.0" y="116" font-size="11" fill="#ffffff" text-anchor="middle">不放片头、Logo、空镜</text>
<text x="70" y="163" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">首句</text>
<rect x="85.0" y="136" width="123.0" height="44" rx="5" fill="#dbe7fb"/>
<text x="146.5" y="155" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">点名人群</text>
<text x="146.5" y="172" font-size="11" fill="#656d76" text-anchor="middle">跟我有关吗</text>
<rect x="210.0" y="136" width="123.0" height="44" rx="5" fill="#dbe7fb"/>
<text x="271.5" y="155" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">给结果</text>
<text x="271.5" y="172" font-size="11" fill="#656d76" text-anchor="middle">我能得到什么</text>
<text x="70" y="219" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">字幕</text>
<rect x="85.0" y="192" width="248.0" height="44" rx="5" fill="#2f6fdf"/>
<text x="209.0" y="211" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">第一帧就出现</text>
<text x="209.0" y="228" font-size="11" fill="#ffffff" text-anchor="middle">很多人静音刷视频</text>
<line x1="334.0" y1="64" x2="334.0" y2="248" stroke="#656d76" stroke-width="1" stroke-dasharray="3 3"/>
<text x="334" y="264" font-size="12" fill="#1f2328" text-anchor="end">首句念完超过 3–4 秒，就删字</text>
<text x="24" y="294" font-size="12" fill="#656d76" text-anchor="start">做不到三件，至少做到前两件；第三件是</text>
<text x="24" y="312" font-size="12" fill="#656d76" text-anchor="start">「为什么现在看」：冲突、反常识、真实的紧迫感</text>
<text x="24" y="330" font-size="12" fill="#656d76" text-anchor="start">首句两段的分界为示意，按自己念的时长定</text>
</svg>

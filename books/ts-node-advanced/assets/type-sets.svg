<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="319" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">类型是值的集合，赋值兼容是子集</text>
<rect x="16" y="44" width="328" height="236" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="26" y="62" font-size="13" font-weight="600" fill="#1f2328">unknown（全集）</text>
<text x="334" y="62" font-size="12" fill="#656d76" text-anchor="end">所有值</text>
<rect x="36" y="70" width="288" height="196" rx="10" fill="#f3f5f7" stroke="#d8dee4"/>
<text x="46" y="88" font-size="13" font-weight="600" fill="#1f2328">string | number</text>
<text x="314" y="88" font-size="12" fill="#656d76" text-anchor="end">并集</text>
<rect x="56" y="96" width="248" height="156" rx="10" fill="#e6e9ed" stroke="#d8dee4"/>
<text x="66" y="114" font-size="13" font-weight="600" fill="#1f2328">string</text>
<text x="294" y="114" font-size="12" fill="#656d76" text-anchor="end">无穷多个字符串</text>
<rect x="76" y="122" width="208" height="116" rx="10" fill="#dbe7fb" stroke="#2f6fdf"/>
<text x="86" y="140" font-size="13" font-weight="600" fill="#1f2328">"a" | "b"</text>
<text x="274" y="140" font-size="12" fill="#656d76" text-anchor="end">两个值</text>
<rect x="96" y="148" width="168" height="76" rx="10" fill="#2f6fdf" stroke="#2f6fdf"/>
<text x="106" y="166" font-size="13" font-weight="600" fill="#ffffff">"a"</text>
<text x="254" y="166" font-size="12" fill="#ffffff" text-anchor="end">一个值</text>
<circle cx="126" cy="192" r="14" fill="#ffffff" stroke="#2f6fdf" stroke-dasharray="3 3"/>
<text x="126" y="196" font-size="11" fill="#2f6fdf" text-anchor="middle">∅</text>
<text x="148" y="196" font-size="12" fill="#ffffff">never（空集）</text>
<text x="180" y="304" font-size="12" fill="#656d76" text-anchor="middle">越往里集合越小：内层的值都能赋给外层的类型</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">轴线：机位放在同一侧（俯视图）</text>
<rect x="20" y="118" width="320" height="150" rx="8" fill="#dbe7fb" opacity="0.6"/>
<text x="30" y="263" font-size="12" fill="#2f6fdf">机位可以放在这一侧</text>
<line x1="30" y1="110" x2="330" y2="110" stroke="#656d76" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="330" y="102" font-size="12" fill="#656d76" text-anchor="end">轴线</text>
<circle cx="110" cy="110" r="20" fill="#2f6fdf"/>
<text x="110" y="115" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
<circle cx="250" cy="110" r="20" fill="#2f6fdf"/>
<text x="250" y="115" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">B</text>
<g fill="#1f2328">
<rect x="226" y="176" width="28" height="18" rx="3"/>
<rect x="106" y="176" width="28" height="18" rx="3"/>
<rect x="166" y="216" width="28" height="18" rx="3"/>
</g>
<g stroke="#1f2328" stroke-width="1" stroke-dasharray="3 3">
<line x1="240" y1="176" x2="118" y2="130"/>
<line x1="120" y1="176" x2="242" y2="130"/>
<line x1="180" y1="216" x2="180" y2="130"/>
</g>
<g font-size="12" fill="#1f2328">
<text x="260" y="198">机位 1：拍 A</text>
<text x="100" y="198" text-anchor="end">机位 2：拍 B</text>
<text x="180" y="247" text-anchor="middle">机位 3：两人中景</text>
</g>
<rect x="166" y="50" width="28" height="18" rx="3" fill="#e6e9ed" stroke="#656d76"/>
<line x1="160" y1="46" x2="200" y2="72" stroke="#656d76" stroke-width="1.5"/>
<line x1="200" y1="46" x2="160" y2="72" stroke="#656d76" stroke-width="1.5"/>
<text x="210" y="64" font-size="12" fill="#656d76">越轴：A、B 左右互换</text>
<text x="180" y="288" font-size="12" fill="#656d76" text-anchor="middle">三个机位拍出来，A 都在画面左边、B 都在右边</text>
</svg>

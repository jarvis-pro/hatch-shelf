<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="299" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">罗亚尔岛：狼测试过的驼鹿</text>
<text x="180" y="52" text-anchor="middle" font-size="12" fill="#656d76">1959–1961 年冬季，约 435 小时空中观察</text>
<text x="100" y="97" text-anchor="end" font-size="13" fill="#1f2328">被狼测试</text><rect x="110" y="80" width="200.0" height="26" rx="3" fill="#e6e9ed"/><text x="116" y="97" font-size="13" font-weight="600" fill="#1f2328">77</text><text x="100" y="141" text-anchor="end" font-size="13" fill="#1f2328">转身逃跑</text><rect x="110" y="124" width="106.5" height="26" rx="3" fill="#dbe7fb"/><text x="116" y="141" font-size="13" font-weight="600" fill="#1f2328">41</text><text x="224.5" y="141" font-size="12" fill="#656d76">其中被杀 5 头</text><text x="100" y="185" text-anchor="end" font-size="13" fill="#1f2328">站住对峙</text><rect x="110" y="168" width="93.5" height="26" rx="3" fill="#dbe7fb"/><text x="116" y="185" font-size="13" font-weight="600" fill="#1f2328">36</text><text x="211.5" y="185" font-size="12" fill="#656d76">被杀 0 头</text><text x="100" y="229" text-anchor="end" font-size="13" fill="#1f2328">最终被杀</text><rect x="110" y="212" width="15.6" height="26" rx="3" fill="#2f6fdf"/><text x="116" y="229" font-size="13" font-weight="600" fill="#ffffff">6</text><text x="133.6" y="229" font-size="12" fill="#656d76">7.8%</text>
<text x="180" y="270" text-anchor="middle" font-size="11" fill="#656d76">站住不跑的 36 头无一被杀；被杀的几乎都是逃跑的</text>
<text x="180" y="287" text-anchor="middle" font-size="11" fill="#656d76">数据：Mech 1966，《罗亚尔岛的狼》</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="249" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">一头猎物被渡鸦叼走多少</text>
<text x="180" y="52" text-anchor="middle" font-size="12" fill="#656d76">罗亚尔岛，按狼群规模比较</text>
<text x="110" y="107" text-anchor="end" font-size="13" fill="#1f2328">2 只（一对）</text><rect x="120" y="88" width="200" height="30" rx="3" fill="#e6e9ed"/><rect x="120" y="88" width="74.0" height="30" rx="3" fill="#2f6fdf"/><text x="202.0" y="108" font-size="14" font-weight="600" fill="#1f2328">约 37%</text><text x="110" y="159" text-anchor="end" font-size="13" fill="#1f2328">6 只的狼群</text><rect x="120" y="140" width="200" height="30" rx="3" fill="#e6e9ed"/><rect x="120" y="140" width="34.0" height="30" rx="3" fill="#2f6fdf"/><text x="162.0" y="160" font-size="14" font-weight="600" fill="#1f2328">约 17%</text>
<rect x="40" y="200" width="12" height="12" rx="2" fill="#2f6fdf"/>
<text x="58" y="210" font-size="12" fill="#1f2328">被渡鸦吃掉</text>
<rect x="150" y="200" width="12" height="12" rx="2" fill="#e6e9ed"/>
<text x="168" y="210" font-size="12" fill="#1f2328">留给狼</text>
<text x="180" y="236" text-anchor="middle" font-size="11" fill="#656d76">数据：Vucetich、Peterson、Waite 2004，据 Science News 报道</text>
</svg>
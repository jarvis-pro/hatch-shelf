<line x1="128.0" y1="78" x2="128.0" y2="84" stroke="#656d76"/>
<text x="128.0" y="97" font-size="11" fill="#656d76" text-anchor="middle">5:00</text>
<line x1="232.0" y1="78" x2="232.0" y2="84" stroke="#656d76"/>
<text x="232.0" y="97" font-size="11" fill="#656d76" text-anchor="middle">10:00</text>
<line x1="336.0" y1="78" x2="336.0" y2="84" stroke="#656d76"/>
<text x="336.0" y="97" font-size="11" fill="#656d76" text-anchor="middle">15:00</text>
<rect x="24" y="117" width="12" height="12" fill="#2f6fdf"/>
<text x="44" y="128" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">开场</text>
<text x="112" y="128" font-size="12" fill="#656d76" text-anchor="start">0:00–0:45</text>
<text x="44" y="145" font-size="12" fill="#1f2328" text-anchor="start">结论或最终效果；分几部分、适合谁</text>
<rect x="24" y="159" width="12" height="12" fill="#dbe7fb"/>
<text x="44" y="170" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">第一部分</text>
<text x="112" y="170" font-size="12" fill="#656d76" text-anchor="start">0:45–4:45</text>
<text x="44" y="187" font-size="12" fill="#1f2328" text-anchor="start">小标题卡 + 讲解演示 + 小结</text>
<rect x="24" y="201" width="12" height="12" fill="#b9cff5"/>
<text x="44" y="212" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">第二部分</text>
<text x="112" y="212" font-size="12" fill="#656d76" text-anchor="start">4:45–9:00</text>
<text x="44" y="229" font-size="12" fill="#1f2328" text-anchor="start">最核心的部分，可稍长</text>
<rect x="24" y="243" width="12" height="12" fill="#dbe7fb"/>
<text x="44" y="254" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">第三部分</text>
<text x="112" y="254" font-size="12" fill="#656d76" text-anchor="start">9:00–13:45</text>
<text x="44" y="271" font-size="12" fill="#1f2328" text-anchor="start">加一个真实踩坑片段</text>
<rect x="24" y="285" width="12" height="12" fill="#2f6fdf"/>
<text x="44" y="296" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">结尾</text>
<text x="112" y="296" font-size="12" fill="#656d76" text-anchor="start">13:45–15:00</text>
<text x="44" y="313" font-size="12" fill="#1f2328" text-anchor="start">回顾要点、下期预告、互动</text>
<text x="180" y="340" font-size="11" fill="#656d76" text-anchor="middle">时间分配为模板建议，按内容调整</text>

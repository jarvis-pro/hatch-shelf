<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" width="360" height="358" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="357" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">15 分钟知识视频的时间结构</text>

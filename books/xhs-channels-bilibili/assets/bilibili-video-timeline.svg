<rect x="39.6" y="50" width="83.2" height="28" fill="#dbe7fb" stroke="#ffffff"/>
<rect x="122.8" y="50" width="88.4" height="28" fill="#b9cff5" stroke="#ffffff"/>
<rect x="211.2" y="50" width="98.8" height="28" fill="#dbe7fb" stroke="#ffffff"/>
<rect x="310.0" y="50" width="26.0" height="28" fill="#2f6fdf" stroke="#ffffff"/>
<line x1="24.0" y1="78" x2="24.0" y2="84" stroke="#656d76"/>

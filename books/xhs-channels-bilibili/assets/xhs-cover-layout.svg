<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" width="360" height="342" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', sans-serif">
<rect x="0.5" y="0.5" width="359" height="341" rx="10" fill="#ffffff" stroke="#d8dee4"/>
<text x="180" y="28" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">小红书 3:4 封面版式</text>
<rect x="24" y="48" width="168" height="224" rx="6" fill="#ffffff" stroke="#656d76"/>
<rect x="34" y="58" width="148" height="204" fill="none" stroke="#d8dee4" stroke-dasharray="4 3"/>
<rect x="34" y="58" width="148" height="86" fill="#2f6fdf"/>
<text x="108.0" y="96" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600">7 个 Mac 软件</text>
<text x="108.0" y="122" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600">每天省 1 小时</text>
<rect x="34" y="152" width="148" height="86" fill="#dbe7fb"/>
<text x="108.0" y="200" font-size="12" fill="#2f6fdf" text-anchor="middle">截图 / 实拍</text>
<rect x="34" y="246" width="148" height="20" fill="#e6e9ed"/>
<text x="108.0" y="260" font-size="11" fill="#656d76" text-anchor="middle">副标题（可选）</text>
<line x1="182" y1="97" x2="202" y2="97" stroke="#d8dee4"/>
<text x="206" y="93.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">① 大字标题</text>
<text x="206" y="109.0" font-size="11" fill="#656d76" text-anchor="start">约占上方四成</text>
<text x="206" y="125.0" font-size="11" fill="#656d76" text-anchor="start">6–12 字，一件事</text>
<line x1="182" y1="186" x2="202" y2="186" stroke="#d8dee4"/>
<text x="206" y="182" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">② 真实画面</text>
<text x="206" y="198" font-size="11" fill="#656d76" text-anchor="start">截图、桌面、手写</text>
<line x1="182" y1="252" x2="202" y2="252" stroke="#d8dee4"/>
<text x="206" y="248" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">③ 副标题</text>
<text x="206" y="264" font-size="11" fill="#656d76" text-anchor="start">补充人群或场景</text>
<line x1="24" y1="296" x2="44" y2="296" stroke="#d8dee4" stroke-dasharray="4 3"/>
<text x="50" y="300" font-size="12" fill="#1f2328" text-anchor="start">④ 虚线为安全边距，文字放在虚线以内</text>
<text x="180" y="324" font-size="11" fill="#656d76" text-anchor="middle">缩成信息流小卡片后，大字仍要能一眼读完</text>
</svg>
